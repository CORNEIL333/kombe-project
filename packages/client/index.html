<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FBF8F1" />
    <meta
      name="description"
      content="KÓMBE — le registre de votre tontine et de votre association. Votre tontine, plus claire."
    />
    <link rel="icon" type="image/svg+xml" href="/brand/kombe-symbol.svg" />
    <link rel="apple-touch-icon" href="/brand/kombe-icone-180.png" />
    <title>KÓMBE</title>
    <style>
      /* Écran d'ouverture (logo animé de la charte) : visible avant même le
         chargement du JavaScript, retiré par src/main.tsx. Styles en ligne
         autorisés par la CSP (style-src 'unsafe-inline'), aucun script. */
      #ouverture { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(70% 60% at 50% 40%, #ffffff 0%, #fbf8f1 60%, #f3ecdd 100%); transition: opacity 420ms cubic-bezier(0.2, 0, 0, 1), transform 420ms cubic-bezier(0.2, 0, 0, 1); }
      #ouverture .k-logo { width: 280px; height: 72px; }
      #ouverture.is-fin { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #ouverture .ouverture__piste { position: relative; width: 120px; height: 3px; margin-top: 44px; border-radius: 3px; background: #e7dcc6; overflow: hidden; }
      #ouverture .ouverture__piste i { position: absolute; top: 0; left: 0; bottom: 0; width: 40%; border-radius: 3px; background: #176b52; animation: ouverture-piste 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      @keyframes ouverture-piste { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #ouverture .ouverture__piste i { animation: none; width: 100%; } }
    </style>
    <script src="/demarrage.js" defer></script>
  </head>
  <body>
    <div id="ouverture" aria-hidden="true"><!--@logo-anime--><span class="ouverture__piste"><i></i></span></div>
    <!-- Le DOM applicatif est entièrement géré par React (src/main.tsx). -->
    <div id="root">
      <p class="chargement" role="status">Chargement de KÓMBE…</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
