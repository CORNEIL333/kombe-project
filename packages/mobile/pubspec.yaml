name: kombe_mobile
description: KÓMBE — client mobile Flutter natif, sans données métier embarquées.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  provider: ^6.1.5+1
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
