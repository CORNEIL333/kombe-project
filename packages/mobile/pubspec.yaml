name: kombe_mobile
description: KÓMBE — client mobile Flutter natif, sans données métier embarquées.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  provider: ^6.1.5+1
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL-Manrope.txt
    - assets/fonts/OFL-Fraunces.txt
  # Polices OFL auto-hébergées : instances statiques tirées des fichiers
  # variables Google Fonts (voir docs/design-system/KOMBE_DESIGN_SYSTEM.md).
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Display-500.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-Title-600.ttf
          weight: 600
