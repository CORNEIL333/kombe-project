# KÓMBE — sécurité de la chaîne logicielle : dépendances et secrets.
#
# - pnpm audit (dépendances de production) : toute vulnérabilité « high » ou
#   « critical » rend le job rouge ;
# - gitleaks : aucun secret (clé d'API, jeton, mot de passe de base) dans
#   l'historique poussé ; rapport expurgé (--redact), jamais la valeur.
# Hebdomadaire en plus des poussées : une faille publiée après coup est vue.
name: Sécurité (dépendances, secrets)

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Audit des dépendances (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm audit --prod (high/critical bloquants)
        run: pnpm audit --prod --audit-level=high

  secrets:
    name: Secrets dans l'historique (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks detect (rapport expurgé)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --no-banner --redact --exit-code 1
