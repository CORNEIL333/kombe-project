openapi: 3.1.1
info:
  title: KÓMBE API
  version: 0.0.0-c00
  summary: Registre de tontines fermées — contrat de commandes (socle C00)
  description: |
    Contrat initial des commandes KÓMBE, posé par C00 avant tout lot métier.
    Toutes les routes sont préfixées `/v1`. Les routes de fonctionnalités
    futures (wallet, prêt, scoring, assurance, IA) NE SONT PAS exposées :
    elles restent fermées côté serveur jusqu'à leur porte de décision.

    Ce fichier est un CONTRAT, pas une génération depuis le code. C28 teste la
    compatibilité de l'implémentation avec ce contrat approuvé (01_Audit/
    ARCHITECTURE_CIBLE.md §Commandes complémentaires). Les routes marquées
    « A19 » étaient absentes du dossier v1 et sont ajoutées ici.

    Monnaie : entier XAF (int64 borné à l'entier sûr JSON), jamais de flottant.
    Commandes mutantes : en-tête Idempotency-Key obligatoire et version d'objet
    attendue (expectedVersion) ; conflit explicite, jamais d'écrasement silencieux.
servers:
  - url: /v1
security:
  - bearerAuth: []

tags:
  - name: ops
    description: Santé d'exploitation (liveness/readiness) — DÉPLOIEMENT
  - name: access
    description: Inscription, vérification de canal, récupération, connexion réelle et privilège opérateur (C02)
  - name: commands
    description: Suivi asynchrone des commandes (reprise, idempotence)
  - name: groups
    description: Groupes et adhésions
  - name: roles
    description: Nominations et changements de rôles (approbateur distinct) — A19
  - name: governance
    description: Cycle de vie du groupe, porte d'amorçage, invitations et acceptation des règles (C03)
  - name: rules
    description: Versions de règles immuables et acceptations
  - name: contributions
    description: Déclarations, validations, compensations
  - name: votes
    description: Ouverture, vote, clôture, annulation
  - name: disputes
    description: Litiges et réouvertures — A19
  - name: disbursements
    description: Demandes de versement, annulations, reversions (externes au pilote) — A19
  - name: rounds
    description: Clôtures de tour — A19
  - name: exports
    description: >
      Exports du relevé : snapshot figé au cutoff, PDF/CSV neutralisé, empreinte
      SHA-256 en manifeste séparé, vérification indépendante et ACL recontrôlée à
      l'acheminement (C12, 10.1–10.5, 18.8)
  - name: journal
    description: >
      Journal d'événements append-only, vérification indépendante de la chaîne,
      checkpoints externes et timeline filtrée par droits (C11, 9.1 → 9.5)
  - name: support
    description: >
      Console support : accès just-in-time à double approbation (COM05),
      expiration serveur, séparation stricte du pouvoir financier et journal
      de sécurité expurgé (C17, 8.5, 9.6, 9.7, 18.17)
  - name: privacy
    description: >
      Données personnelles : notices légales versionnées sans promesse,
      registre des traitements factuel, consentement séparé du service cœur,
      droits à vérification proportionnée, export filtré, purge/tombstones et
      restauration réappliquant effacements et révocations (C16, 13.1–13.4,
      18.10, 18.19)
  - name: metrics
    description: >
      Mesure du pilote et économie unitaire : entonnoir d'analytics pseudonymisé
      sans aucun champ financier/identitaire individuel (C18-ANALYTICS), cohortes
      à cycles = rotation complète (C18-COHORT), économie unitaire en XAF entier
      distinguant paiement réel et promesse (C18-PAYERS, porte G2), et registre
      des risques dont un critique sans contrôle effectif bloque l'extension
      (C18, 16.1–16.3, 18.13)

paths:
  /groups:
    post:
      tags: [groups]
      operationId: createGroup
      summary: Créer un groupe (état configuration)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
      responses:
        "201":
          description: Groupe créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /groups/{groupId}/memberships:
    post:
      tags: [groups]
      operationId: inviteMember
      summary: Inviter un membre (adhesion active unique)
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteMemberRequest" }
      responses:
        "201":
          description: Adhésion en attente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "409": { $ref: "#/components/responses/Conflict" }

  /discoverable-groups:
    get:
      tags: [governance]
      operationId: listDiscoverableGroups
      summary: Découvrabilité publique des groupes (sans registre réel, C03 §4.1)
      security: []
      responses:
        "200":
          description: >
            Tableau des groupes ouvrables à la découverte — nom + modèle +
            typologie seulement, jamais de registre avant adhésion.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiscoverableGroup" }

  /me/groups:
    get:
      tags: [governance]
      operationId: listMyGroups
      summary: Vue consolidée « mes tontines » d'un membre (multi-adhésion, C21 §2.5)
      description: >
        Liste TOUTES les tontines dont l'identité de session fait partie (un
        membre peut appartenir à plusieurs tontines). L'identité est résolue
        SERVEUR depuis le Bearer (§14) — jamais transmise/choisie par le client.
        Révèle la hiérarchie de supervision (`parentGroupId`) mais N'EXPOSE AUCUN
        champ financier. Pont `SECURITY DEFINER` `kombe_member_groups(text)`
        (migration 0025) car `membership` est sous RLS tenant.
      responses:
        "200":
          description: Tableau des adhésions du membre (toutes tontines).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberGroupSummary" }

  /groups/{groupId}/sponsorships:
    post:
      tags: [governance]
      operationId: requestSponsorship
      summary: Demander un parrainage / cooptation (C03 §4.1)
      description: >
        Le candidat est l'acteur de session (résolu serveur, §14) ; le parrain
        (CIBLE) doit être membre actif réel. Parrain = soi-même → refus ; parrain
        non membre actif → refus ; demande déjà ouverte pour le candidat → conflit.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SponsorshipRequest" }
      responses:
        "201":
          description: Parrainage demandé (état requested)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sponsorship" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /groups/{groupId}/sponsorships/{sponsorshipId}/decision:
    post:
      tags: [governance]
      operationId: decideSponsorship
      summary: Décider un parrainage ouvert (endorsed/rejected)
      description: >
        Le décideur doit être membre actif du groupe (anti-IVOR). Un parrainage
        déjà tranché ne peut être redécidé (conflit d'état).
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: sponsorshipId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SponsorshipDecisionRequest" }
      responses:
        "200":
          description: Décision appliquée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sponsorship" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /role-nominations/{nominationId}/acceptances:
    post:
      tags: [roles]
      operationId: acceptNomination
      summary: Le nommé accepte sa fonction (A19)
      parameters:
        - name: nominationId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Acceptation enregistrée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleNomination" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /role-change-requests/{requestId}/approvals:
    post:
      tags: [roles]
      operationId: approveRoleChange
      summary: Approbation par un acteur distinct du demandeur (A19)
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "200":
          description: Changement approuvé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleChangeRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /groups/{groupId}/contributions:
    post:
      tags: [contributions]
      operationId: declareContribution
      summary: Déclarer une cotisation (pot externe au pilote)
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeclareContributionRequest" }
      responses:
        "201":
          description: Déclaration enregistrée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contribution" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /groups/{groupId}/votes:
    post:
      tags: [votes]
      operationId: openVote
      summary: Ouvrir un vote (électeurs figés à l'ouverture)
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenVoteRequest" }
      responses:
        "201":
          description: Vote ouvert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vote" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /votes/{voteId}/ballots:
    post:
      tags: [votes]
      operationId: castBallot
      summary: Émettre un bulletin (unicité vote/électeur ; votant = identité serveur)
      parameters:
        - name: voteId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: { type: string, enum: [yes, no, abstain] }
      responses:
        "201": { description: Bulletin enregistré (accepté) }
        "200":
          description: >
            Bulletin refusé sans écriture (non-électeur, double vote, hors
            échéance serveur) — voteAccepted=false, aucune mutation, aucune
            version incrémentée (convention C07/C08).
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /proposals/{proposalId}/closures:
    post:
      tags: [votes]
      operationId: closeProposal
      summary: Clôturer une proposition (A19)
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "200": { description: Proposition clôturée }
        "409": { $ref: "#/components/responses/Conflict" }

  /proposals/{proposalId}/cancellations:
    post:
      tags: [votes]
      operationId: cancelProposal
      summary: Annuler une proposition (A19, motif obligatoire — 7.3/18.5)
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { description: Proposition annulée }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /votes/{voteId}/executions:
    post:
      tags: [votes]
      operationId: executeProposal
      summary: >
        Exécuter une décision clôturée et approuvée (7.4). Idempotent : une
        seconde exécution rend le même état sans nouvel effet. Aucune entrée de
        décision n'est acceptée du client (résultat figé à la clôture par
        l'oracle serveur).
      parameters:
        - name: voteId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "200": { description: Décision exécutée (ou déjà exécutée — idempotent) }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /groups/{groupId}/votes/{voteId}:
    get:
      tags: [votes]
      operationId: readVote
      summary: >
        Vue authentifiée et SCOPEE d'une proposition (électorat, résultat figé,
        dates serveur, version). Anti-IDOR : un objet d'un autre groupe sous un
        chemin tiers répond 404 (non-divulgation), jamais son contenu.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: voteId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Vue de la proposition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vote" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/decisions:
    get:
      tags: [votes]
      operationId: listDecisions
      summary: >
        Historique chronologique des décisions d'un groupe (7.5) : propositions
        closes, exécutées ou annulées (une volée encore ouverte n'est pas une
        décision). Lecture authentifiée et scopée.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Liste des décisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisions:
                    type: array
                    items: { $ref: "#/components/schemas/Vote" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /groups/{groupId}/disputes:
    post:
      tags: [disputes]
      operationId: raiseDispute
      summary: >
        Ouvrir un litige sur une cotisation (6.5). Motif obligatoire ; fenêtre
        ordinaire de 7 jours après notification ; signalement de fraude ou
        d'erreur grave toujours recevable. Avant validation le litige bloque la
        validation ; après validation il gèle clôture et opérations dépendantes
        sans effacer aucune écriture.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeRequest" }
      responses:
        "201":
          description: Litige ouvert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeReceipt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /groups/{groupId}/cycle-readiness:
    get:
      tags: [governance]
      operationId: readCycleReadiness
      summary: Agrégats serveur évaluant la préparation au démarrage du cycle
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: >
            Fonctions indépendantes acceptées / requises, acceptation des règles
            par tous, suppléant du trésorier, effectif actif. Calculés côté
            serveur, jamais fournis par le client.

  /groups/{groupId}/cycle-starts:
    post:
      tags: [governance]
      operationId: startCycle
      summary: Démarrer le cycle — porte serveur (fondateur seul ⇒ 409)
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "201": { description: Cycle démarré (configuration → active) }
        "409":
          description: CYCLE_START_NOT_READY — préconditions d'amorçage non remplies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups/{groupId}/state-transitions:
    post:
      tags: [governance]
      operationId: transitionGroupState
      summary: Transition d'état du groupe, bornée (2.7)
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  enum: [active, paused, closed, stopped_with_discrepancies, archived]
      responses:
        "200": { description: Nouvel état appliqué }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /groups/{groupId}/membership-terminations:
    post:
      tags: [governance]
      operationId: terminateMembership
      summary: Terminer une adhésion (départ/révocation) avant la prochaine commande
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityId]
              properties:
                identityId: { type: string }
      responses:
        "200": { description: Adhésion terminée (état terminal) }
        "403": { $ref: "#/components/responses/Forbidden" }

  /groups/{groupId}/rules-acceptances:
    post:
      tags: [governance]
      operationId: acceptCurrentRules
      summary: Accepter la version courante des règles (consentement horodaté, 4.2)
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityId]
              properties:
                identityId: { type: string }
      responses:
        "201": { description: Acceptation enregistrée à la version en vigueur }

  /invitations/{invitationId}/redemptions:
    post:
      tags: [governance]
      operationId: redeemInvitation
      summary: Racheter une invitation bornée/expirante/révocable (4.1)
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Usage consommé (vue publique, aucun registre révélé) }
        "410":
          description: >
            INVITATION_INVALID — erreur unique non divulguante (expirée, révoquée
            ou épuisée ne sont pas distinguées pour un observateur externe)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ── C04 — moteur de règles versionnées et acceptations (3.1 → 3.7, 6.7) ──
  /groups/{groupId}/rule-versions:
    post:
      tags: [rules]
      operationId: publishRuleVersion
      summary: Publier une version immuable des règles (hash canonique ; pénalités fermées au pilote)
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot]
              properties:
                snapshot: { $ref: "#/components/schemas/RuleSet" }
                supersedes: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Version scellée (penaltyEnabled normalisé à false au pilote)
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: integer }
                  hash: { type: string, pattern: "^[0-9a-f]{64}$" }
                  penaltyEnabled: { type: boolean }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /groups/{groupId}/rule-versions/{version}/acceptances:
    post:
      tags: [rules]
      operationId: acceptRuleVersionByHash
      summary: Accepter une version sur son hash EXACT (consentement horodaté)
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityId, hash]
              properties:
                identityId: { type: string }
                hash: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "201": { description: Acceptation enregistrée }
        "412":
          description: RULE_ACCEPT_HASH_MISMATCH — le hash soumis ne correspond pas à la version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups/{groupId}/rule-changes:
    post:
      tags: [rules]
      operationId: evaluateRuleChange
      summary: Effectivité d'un changement publié (essentiel ⇒ cycle suivant, accord de tous)
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, concerned]
              properties:
                version: { type: integer, minimum: 1 }
                concerned: { type: array, items: { type: string }, minItems: 1 }
      responses:
        "200":
          description: >
            essential, appliesTo (next_cycle|immediate), new_rule_executed —
            false si une personne concernée n'a pas accepté (C04-ACCEPT)

  /groups/{groupId}/cycle-recalculations:
    post:
      tags: [rules]
      operationId: recalculateCurrentCycle
      summary: Recalcul du cycle courant sous garde de non-rétroactivité (C04-RETRO)
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: "past_due_changed = false (aucune échéance passée réécrite)"
        "409":
          description: RULE_RETROACTIVE — une échéance déjà passée serait modifiée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups/{groupId}/penalty-requests:
    post:
      tags: [rules]
      operationId: requestPenalty
      summary: Demande d'activation des pénalités — refusée au pilote (C04-PENALTY)
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [desired]
              properties:
                desired: { type: boolean }
      responses:
        "200":
          description: >
            penalty_enabled = false au pilote quelle que soit la demande
            (rejected = true si demandée)

  # ── C05 — cycles, tours, échéances, bénéficiaires (5.1 → 5.5) ──
  /groups/{groupId}/schedules:
    post:
      tags: [rounds]
      operationId: buildCycleSchedule
      summary: >
        Construit le calendrier d'un cycle (N tours / N membres, bénéficiaire
        unique par tour, dates métier bornées, instants UTC). Deux tours au même
        bénéficiaire ⇒ refus 422 SCHEDULE_BENEFICIARY_DUPLICATE (C05-UNIQUE,
        schedule_accepted = false, aucune écriture).
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleBuildRequest" }
      responses:
        "201":
          description: Calendrier (brouillon) avec totaux nés de l'oracle rotation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CycleScheduleView" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [rounds]
      operationId: getCycleSchedule
      summary: Lecture du calendrier courant d'un groupe.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Calendrier mémorisé.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CycleScheduleView" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/schedule-starts:
    post:
      tags: [rounds]
      operationId: startCycleSchedule
      summary: Démarre (gèle) le calendrier — ordre des bénéficiaires figé (5.3).
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "201":
          description: "state = started ; rounds conservé."
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [started] }
                  rounds: { type: integer, minimum: 1 }
        "409": { $ref: "#/components/responses/Conflict" }

  /groups/{groupId}/rounds/{seq}/beneficiary:
    post:
      tags: [rounds]
      operationId: reassignRoundBeneficiary
      summary: >
        Réassignation d'un bénéficiaire. Après démarrage ⇒ 409 SCHEDULE_FROZEN ;
        avant démarrage, la nouvelle liste reste une permutation valide (doublure
        ⇒ 422 SCHEDULE_BENEFICIARY_DUPLICATE). Le changement voté (5.4) est P1.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: seq
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq, newBeneficiaryId]
              properties:
                seq: { type: integer, minimum: 1 }
                newBeneficiaryId: { type: string }
      responses:
        "200":
          description: Bénéficiaire réassigné (brouillon).
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /groups/{groupId}/departures:
    post:
      tags: [rounds]
      operationId: applyMemberDeparture
      summary: >
        Départ d'un membre — la dette déjà due reste affectée au partant
        (debtReassigned = false) et le nombre de tours n'est PAS réduit
        silencieusement (roundsUnchanged = true).
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityId]
              properties:
                identityId: { type: string }
      responses:
        "200":
          description: Vue de départ (dette conservée, tours non réduits).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepartureView" }

  /groups/{groupId}/cycle-renewals:
    post:
      tags: [rounds]
      operationId: planCycleRenewal
      summary: >
        Plan de renouvellement (5.5) — repart de la version acceptée ; exige de
        nouvelles acceptations si l'engagement essentiel change ; historique
        conservé. Ne crée pas le nouveau cycle (commande ultérieure).
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CycleRenewalRequest" }
      responses:
        "200":
          description: Plan de renouvellement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenewalPlan" }

  # ── C11 — journal d'événements, checkpoints, timeline (9.1 → 9.5) ──
  /groups/{groupId}/journal/verify:
    get:
      tags: [journal]
      operationId: verifyJournal
      summary: >
        Vérification INDÉPENDANTE de la chaîne (9.2/9.4) : intégrité de chaque
        hash, continuité depuis la genèse, séquence incrémentale, alignement des
        checkpoints. Le serveur lit sans jamais recalculer pour masquer une
        altération.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Résultat de vérification (intact ou rupture localisée).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalVerifyResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/timeline:
    get:
      tags: [journal]
      operationId: getGroupTimeline
      summary: >
        Timeline en langage clair, filtrée par les droits du rôle (9.1/9.3). Le
        payload brut n'est jamais exposé ; un événement privé (litige) est
        retiré pour un rôle non autorisé. Filtre optionnel par type d'événement.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: type
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Entrées de timeline lisibles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/journal-checkpoints:
    post:
      tags: [journal]
      operationId: issueJournalCheckpoint
      summary: >
        Émission d'un point de contrôle EXTERNE scellé sur le hash de tête (9.2).
        Réservé aux rôles tenant l'action `journal.checkpoint`
        (auditor/secretary/treasurer) ; refus 403 sinon.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckpointRequest" }
      responses:
        "201":
          description: Checkpoint scellé.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkpoint" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/projections-rebuild:
    post:
      tags: [journal]
      operationId: rebuildProjections
      summary: >
        Reconstruction des projections par replay versionné et réconciliation
        avec la projection de référence (C11-REBUILD, 9.5) : effacer une
        projection ne change rien, le replay la régénère à l'identique.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Résultat de réconciliation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RebuildResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/declarations:
    post:
      tags: [contributions]
      operationId: declareContribution
      summary: >
        Déclaration partielle idempotente (6.1, 18.1, 18.3). La clé
        d'idempotence est scopée (acteur, groupe, type) et compare un hash
        canonique du corps : même clé/même corps = rejeu du résultat d'origine
        sans second événement ; même clé/corps différent = 409. Le montant est
        réservé sous la capacité restante (dû − réservations) ; un excédent est
        bloqué (409). Date serveur distincte de la date alléguée.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContributionDeclaration" }
      responses:
        "201":
          description: Déclaration appliquée (première exécution).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeclarationReceipt" }
        "200":
          description: Rejeu idempotent du résultat d'origine (aucun second événement).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeclarationReceipt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /groups/{groupId}/drafts:
    post:
      tags: [contributions]
      operationId: saveContributionDraft
      summary: >
        Enregistrement d'un brouillon de déclaration SANS soumission ni mutation
        (6.1) : ne réserve aucune capacité, ne pose aucun événement, ne consomme
        aucune clé d'idempotence.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContributionDeclaration" }
      responses:
        "200":
          description: Brouillon enregistré, rien n'est soumis.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftReceipt" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /groups/{groupId}/obligations/{obligationId}:
    get:
      tags: [contributions]
      operationId: getObligation
      summary: >
        Vue d'une obligation (lecture seule, sans mutation) : dû, validé net,
        réservations actives, restant dû (dû − validé net) et capacité à déclarer
        (dû − réservations). Montants rendus en entiers (18.3).
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: obligationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Solde de l'obligation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContributionObligationView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/contributions/{contributionId}:
    get:
      tags: [contributions]
      operationId: getContributionValidation
      summary: >
        Vue de validation d'une cotisation (lecture seule, sans mutation) : état
        de la machine à états, déclarant, confirmateur, contrôleurs, seuil
        requis, et statut de compensation (original compensé, nombre de
        contre-écritures). Montants rendus en entiers.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: contributionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: État de validation de la cotisation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContributionValidationView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/contributions/{contributionId}/confirmations:
    post:
      tags: [contributions]
      operationId: confirmContribution
      summary: >
        Confirmation d'une cotisation par un acteur INDÉPENDANT du déclarant
        (6.3, 6.4). Le déclarant qui se confirme lui-même est refusé sans effet
        (validation_accepted = false). Si aucun contrôle distinct n'est requis,
        la confirmation valide atomiquement ; sinon la cotisation passe en
        `confirmed`. Un litige ouvert sur l'obligation bloque la validation
        finale (6.5).
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: contributionId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "200":
          description: Reçu d'acte de confirmation (accepté/refusé, état, version).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationActReceipt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /groups/{groupId}/contributions/{contributionId}/control:
    post:
      tags: [contributions]
      operationId: controlContribution
      summary: >
        Contrôle par un TIERS distinct du déclarant et du confirmateur (6.3,
        6.4). Un acteur ne cumule pas confirmer puis contrôler
        (validation_accepted = false). Au seuil de contrôleurs atteint, la
        cotisation est validée.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: contributionId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "200":
          description: Reçu d'acte de contrôle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationActReceipt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /groups/{groupId}/contributions/{contributionId}/rejections:
    post:
      tags: [contributions]
      operationId: rejectContribution
      summary: >
        Rejet d'une cotisation **avant validation seulement** (6.2). Rejeter une
        cotisation déjà validée est refusé (409 CONTRIBUTION_STATE_INVALID) ;
        la correction d'un validé passe par compensation, jamais par effacement.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: contributionId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "200":
          description: Reçu de rejet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationActReceipt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /groups/{groupId}/contributions/{contributionId}/compensations:
    post:
      tags: [contributions]
      operationId: compensateContribution
      summary: >
        Compensation d'un original validé par contre-écriture liée (6.2, 6.6) :
        aucune suppression, l'écriture est conservée et l'événement inverse est
        rattaché à l'original. Un original n'est compensé **qu'une seule fois**
        (seconde tentative ⇒ 409 CONTRIBUTION_ALREADY_COMPENSATED, C07-REVERSE).
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: contributionId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompensationRequest" }
      responses:
        "201":
          description: Contre-écriture appliquée.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompensationReceipt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /groups/{groupId}/obligations/{obligationId}/dependent-operation-attempts:
    post:
      tags: [disputes]
      operationId: attemptDependentOperation
      summary: >
        Sonde d'une opération dépendante d'un montant (clôture de tour, etc.) :
        un litige ouvert sur l'obligation gèle l'opération (409
        ROUND_CLOSE_BLOCKED_BY_DISPUTE) **sans** effacer écriture ni validation
        (6.5). Lecture de garde, sans mutation.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: obligationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Opération dépendante autorisée (aucun litige ouvert).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DependentOperationReceipt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ── C08 — Décaissements, corrections, rapprochement et clôture (6.10, 18.4, 18.9, 2.8) ──
  # KÓMBE ne transfère AUCUN fonds : un décaissement documente une sortie déjà
  # effectuée hors système. Le déclarant n'est jamais le bénéficiaire (séparation
  # des pouvoirs) ; la correction suit demande → approbation INDÉPENDANTE →
  # contre-écriture UNIQUE ; `refundedExternally` reste structurellement false.
  /groups/{groupId}/disbursements:
    post:
      tags: [disbursements]
      operationId: declareDisbursement
      summary: >
        Déclarer un décaissement externe (6.10) : bénéficiaire, montant net,
        frais de groupe (et frais personnels HORS pot, séparés et jamais déduits
        du rapprochement). Le déclarant est l'acteur résolu serveur ; s'il est le
        bénéficiaire, un suppléant doit déclarer (422 DISBURSEMENT_SUBSTITUTE_REQUIRED).
        Montants entiers XAF (ADR-0002). Aucun transfert exécuté par KÓMBE.
        NOTE : la clé d'idempotence n'est PAS encore consommée par ce lot
        (registre d'idempotence = lot C13) — aucun en-tête IdempotencyKey n'est
        documenté ici pour ne pas promettre une rejouabilité non implémentée.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Décaissement déclaré (état `requested`, version 1).
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /groups/{groupId}/disbursements/{disbursementId}:
    get:
      tags: [disbursements]
      operationId: getDisbursement
      summary: >
        Vue d'un décaissement (état, acteurs d'indépendance, correction, version).
        Lecture authentifiée et scopée : un acteur d'un autre groupe est refusé
        (403) ; un objet dont le groupe réel diffère du groupe du chemin répond
        404 non-divulgation — jamais les données d'un autre groupe.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: disbursementId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Décaissement.
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/disbursements/{disbursementId}/confirmations:
    post:
      tags: [disbursements]
      operationId: confirmDisbursement
      summary: >
        Confirmation par le BÉNÉFICIAIRE seul (6.10). Un acteur autre que le
        bénéficiaire est refusé sans écriture (actAccepted = false, NOT_BENEFICIARY).
        Sans contrôleur requis, la confirmation parachève (`completed`) ; sinon la
        demande reste en attente d'un contrôleur distinct.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: disbursementId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "200":
          description: Reçu d'acte (accepté/refusé, état, version).
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /groups/{groupId}/disbursements/{disbursementId}/control:
    post:
      tags: [disbursements]
      operationId: controlDisbursement
      summary: >
        Contrôle distinct et indépendant (6.10) : ni déclarant ni bénéficiaire
        (NOT_INDEPENDENT), pas de cumul d'un même contrôleur (ACTOR_ALREADY_ACTED),
        et suppose la confirmation préalable du bénéficiaire. Au seuil atteint, le
        décaissement s'achève.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: disbursementId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "200":
          description: Reçu d'acte de contrôle.
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /groups/{groupId}/disbursements/{disbursementId}/reversal-requests:
    post:
      tags: [disbursements]
      operationId: requestDisbursementReversalC08
      summary: >
        Demande de correction d'un décaissement ACHEVÉ (6.10, 18.9). Motif non
        vide requis ; l'état passe en `reversal_requested` dans l'attente d'une
        approbation indépendante. Jamais de remboursement automatique externe
        (`refundedExternally` = false).
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: disbursementId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Demande de correction enregistrée.
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /groups/{groupId}/disbursements/{disbursementId}/reversals:
    post:
      tags: [disbursements]
      operationId: confirmDisbursementReversalC08
      summary: >
        Approbation INDÉPENDANTE → contre-écriture UNIQUE (C08-CORRECTION, 6.10).
        L'approbateur ne peut être ni le demandeur, ni le déclarant, ni le
        bénéficiaire (403 DISBURSEMENT_REVERSAL_NOT_INDEPENDENT — il jugerait sa
        propre cause) ; un original déjà reversé ne l'est qu'une fois (409
        DISBURSEMENT_ALREADY_REVERSED, reversalCount figé à 1). La sérialisation
        concurrente sous verrou est une preuve base réelle (BLOCKED).
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: disbursementId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "200":
          description: Contre-écriture appliquée (une seule).
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /groups/{groupId}/rounds/{roundId}/reconciliation:
    get:
      tags: [rounds]
      operationId: reconcileRound
      summary: >
        Rapprochement d'un tour et décision de clôture normale (18.4, 18.9) via
        l'oracle indépendant : `écart = validé net − décaissements nets − frais
        groupe`. TOUTES les entrées de décision sont DÉTENUES SERVEUR : totaux
        recalculés depuis les écritures stockées, total validé net et bloqueurs
        (litige bloquant, impayé affectant le pot) posés par les flux serveur.
        Aucun paramètre de décision n'est accepté du client — un client ne peut
        ni forcer `normalCloseAccepted`, ni masquer un écart, ni cacher un
        litige (barrières serveur, règle 18 ; ADR-0005). La clôture normale
        n'est admise que si écart nul ET sans litige bloquant ET sans impayé
        affectant le pot ; l'écart reste visible, jamais masqué.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: roundId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rapprochement (écart, clôture normale admise ou non, motifs).
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── C10 — Litiges et recours (stories 8.1 → 8.4) ──────────────────────────
  # Aucun montant ne transite par ce lot : la résolution ferme le dossier sans
  # toucher un total (correction exclusivement via compensation C07/C08).
  /groups/{groupId}/dispute-cases:
    post:
      tags: [disputes]
      operationId: openDisputeCase
      summary: >
        Ouvrir un DOSSIER de litige (8.1). Motif ET correction demandée
        obligatoires et non vides ; pièces désactivées au pilote (aucun champ) ;
        le levant est résolu serveur depuis le jeton d'acteur, jamais fourni.
        Aucun montant acceptable : le schéma n'en porte pas.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeCaseRequest" }
      responses:
        "201":
          description: Dossier ouvert (détail complet renvoyé au levant, partie).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeRecord" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [disputes]
      operationId: listDisputeCases
      summary: >
        Liste des VUES COMMUNES des dossiers du groupe (8.1) — le détail privé
        n'y transite jamais ; lecture seule, sans divulgation inter-groupes.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Tableau des vues communes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DisputeCommonView" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /groups/{groupId}/dispute-cases/{disputeId}:
    get:
      tags: [disputes]
      operationId: getDisputeCase
      summary: >
        Vue d'un dossier (C10-PRIVACY) : VUE COMMUNE pour un non-partie, DÉTAIL
        complet réservé aux parties (levant, impliqués, résolveurs désignés). La
        rétention est structurelle — la vue commune ne contient pas les champs
        privés. 404 non divulguant si hors portée.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: disputeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Vue commune (non-partie) ou détail (partie autorisée).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DisputeCommonView"
                  - $ref: "#/components/schemas/DisputeRecord"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/dispute-cases/{disputeId}/resolvers:
    post:
      tags: [disputes]
      operationId: designateResolvers
      summary: >
        Désigner les résolveurs (8.2). Un résolveur IMPLIQUÉ (levant ou
        impliqué) est refusé 403 DISPUTE_RESOLVER_NOT_INDEPENDENT ; une
        hiérarchie de rôle ne remplace pas l'indépendance. La désignation vide
        (tous impliqués) maintient le gel et la procédure externe.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: disputeId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolversRequest" }
      responses:
        "200":
          description: Résolveurs désignés (dossier + version).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeActReceipt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /groups/{groupId}/dispute-cases/{disputeId}/resolution:
    post:
      tags: [disputes]
      operationId: resolveDisputeCase
      summary: >
        Résoudre le dossier (8.3, C10-RESOLVE) : ferme le ticket sans modifier
        AUCUN montant (`validated_total_delta = 0`, structurel). Exige un
        résolveur DÉSIGNÉ ET INDÉPENDANT et une ISSUE documentée non vide ;
        l'issue peut RÉFÉRENCER des écritures de compensation C07/C08 (jamais
        des montants). Double résolution ⇒ 409.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: disputeId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeResolutionRequest" }
      responses:
        "200":
          description: Dossier résolu (dossier + version) ; aucun total touché.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeActReceipt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /groups/{groupId}/dispute-cases/{disputeId}/appeals:
    post:
      tags: [disputes]
      operationId: appealDisputeCase
      summary: >
        Recours (8.3) : le LEVANT rouvre un dossier résolu, LIÉ à l'original ;
        la première résolution reste historisée, le gel ciblé revient, aucun
        montant n'est touché. Toute autre demande ⇒ 403 non révélateur (gated).
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: disputeId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "200":
          description: Dossier rouvert lié à l'original (dossier + version).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeActReceipt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /groups/{groupId}/round-close-attempts:
    post:
      tags: [disputes]
      operationId: attemptRoundClose
      summary: >
        Sonde de clôture normale d'un tour (C10-FREEZE) : gelée 409
        ROUND_CLOSE_BLOCKED_BY_DISPUTE si une seule obligation du tour porte un
        litige OUVERT — sans effacement. Le gel se lève par résolution
        indépendante. Lecture de garde, sans mutation.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoundCloseRequest" }
      responses:
        "200":
          description: Clôture admise (aucun litige ouvert sur le tour).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoundCloseReceipt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ── C17 : console support, accès JIT, double approbation (8.5, 9.6, 18.17) ──
  /support/access-requests:
    post:
      tags: [support]
      operationId: createSupportAccessRequest
      summary: >
        Demande d'accès support (9.6). Motif obligatoire ; le demandeur est
        l'identité résolue SERVEUR (jamais un champ du corps). Toute permission
        financière ou inconnue est refusée à la création (403) : la demande naît
        pending_approval, ZÉRO accès sensible.
      parameters:
        - $ref: "#/components/parameters/ServerDate"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportAccessRequestInput" }
      responses:
        "201":
          description: Demande enregistrée, en attente de double approbation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAccessView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /support/access-requests/{requestId}/approvals:
    post:
      tags: [support]
      operationId: approveSupportAccess
      summary: >
        Approbation (COM05) par une identité DISTINCTE du demandeur, résolue
        SERVEUR. Au seuil de deux approbateurs distincts, l'accès passe granted
        et son expiration est posée ; en dessous, reste pending_approval.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ServerDate"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportApprovalInput" }
      responses:
        "200":
          description: Demande mise à jour (pending ou granted).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAccessView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /support/access-requests/{requestId}/actions:
    post:
      tags: [support]
      operationId: performSupportAction
      summary: >
        Épreuve d'une action sensible (8.5, 18.17, C17-JIT). Action financière
        ⇒ 403 SUPPORT_FINANCIAL_FORBIDDEN (jamais exécutée) ; accès non
        granted/expiré ⇒ 403 ; hors périmètre ou permission absente ⇒ 403. Le
        refus est consigné au journal de sécurité expurgé.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ServerDate"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportActionInput" }
      responses:
        "200":
          description: Décision d'accès (autorisée ou refus remonté en erreur).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportActionReceipt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /support/access-requests/{requestId}/revocations:
    post:
      tags: [support]
      operationId: revokeSupportAccess
      summary: >
        Révocation immédiate (fin d'assistance / incident) — coupe l'accès ; un
        accès éteint ne se réactive pas.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ServerDate"
      responses:
        "200":
          description: Accès révoqué.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAccessView" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/support/access-requests/{requestId}:
    get:
      tags: [support]
      operationId: getSupportAccessRequest
      summary: >
        Vue scopée et authentifiée d'une demande. Anti-IDOR : un objet d'un autre
        groupe sous un chemin tiers répond 404 non-divulgation, jamais ses données.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Vue de la demande (statut, approbateurs, expiration, version).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportAccessView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/exports:
    post:
      tags: [exports]
      operationId: createStatementExport
      summary: >
        Génère un relevé exporté (10.1, 18.8). Le demandeur doit être membre du
        groupe (sinon 404 non-divulgation) ; la séquence de coupure est résolue
        SERVEUR, jamais au-delà de l'état réel. Empreinte SHA-256 sur octets
        finalisés consignée dans un manifeste séparé ; mention prudente obligatoire.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/ServerDate"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatementExportInput" }
      responses:
        "201":
          description: Manifeste d'export posé (empreintes, coupure, mention prudente).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportManifestView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /exports/{manifestId}/manifest:
    get:
      tags: [exports]
      operationId: getExportManifest
      summary: >
        Vue du manifeste (empreintes, coupure, version du générateur, mention
        prudente). ACL recontrôlée à la lecture : un non-titulaire ou membre
        sortant reçoit 404, jamais les données.
      parameters:
        - $ref: "#/components/parameters/ManifestId"
        - $ref: "#/components/parameters/ServerDate"
      responses:
        "200":
          description: Manifeste de l'export.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportManifestView" }
        "404": { $ref: "#/components/responses/NotFound" }

  /exports/{manifestId}/download:
    get:
      tags: [exports]
      operationId: downloadStatementExport
      summary: >
        Téléchargement privé du PDF. L'accès est RECONTRÔLÉ à l'acheminement : un
        membre sortant après génération reçoit 404 (C12-DOWNLOAD), jamais les
        octets. Aucun contenu n'est signé juridiquement.
      parameters:
        - $ref: "#/components/parameters/ManifestId"
        - $ref: "#/components/parameters/ServerDate"
      responses:
        "200":
          description: Octets du PDF imprimable (intégrité vérifiable via /verifications).
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /exports/{manifestId}/csv:
    get:
      tags: [exports]
      operationId: downloadStatementCsv
      summary: >
        Téléchargement du CSV neutralisé contre l'injection de formule (10.1) ;
        mêmes ACL qu'au PDF.
      parameters:
        - $ref: "#/components/parameters/ManifestId"
        - $ref: "#/components/parameters/ServerDate"
      responses:
        "200":
          description: CSV du relevé (champs texte neutralisés, montants typés).
          content:
            text/csv:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /exports/{manifestId}/verifications:
    post:
      tags: [exports]
      operationId: verifyStatementExport
      summary: >
        Vérification INDÉPENDANTE (C12-HASH) : le client soumet, en base64, les
        octets du fichier qu'il détient ; le serveur recalcule l'empreinte et la
        compare au manifeste. Un octet altéré ⇒ verification_passed = false. Le
        résultat vient du recalcul réel, jamais d'une constante.
      parameters:
        - $ref: "#/components/parameters/ManifestId"
        - $ref: "#/components/parameters/ServerDate"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportVerificationInput" }
      responses:
        "200":
          description: Résultat de vérification d'intégrité.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportVerificationResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /privacy/notices:
    post:
      tags: [privacy]
      summary: Publier une notice légale versionnée (13.1, 13.2)
      description: >
        Refusée (422) si le corps contient un placeholder (« bientôt », « TBD »…)
        ou une promesse de garantie des fonds / de valeur juridique. Une notice
        publiée est immuable (version = nouvelle ligne en base, 0016).
      parameters:
        - { $ref: "#/components/parameters/ServerDate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalNoticeInput" }
      responses:
        "201":
          description: Notice publiée.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalNoticeView" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /privacy/notices/{noticeId}:
    get:
      tags: [privacy]
      summary: Lire une notice légale
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Notice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalNoticeView" }
        "404": { $ref: "#/components/responses/NotFound" }

  /privacy/processing-records:
    post:
      tags: [privacy]
      summary: Enregistrer un traitement au registre (13.3)
      description: >
        Enregistrement factuel : finalité et pays sans placeholder, catégories
        non vides, base juridique connue, durée de conservation entière positive.
      parameters:
        - { $ref: "#/components/parameters/ServerDate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProcessingRecordInput" }
      responses:
        "201":
          description: Traitement enregistré.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessingRecordView" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /privacy/consents:
    post:
      tags: [privacy]
      summary: Accorder/retirer un consentement facultatif (13.4)
      description: >
        Catégories strictement facultatives (recherche / marketing / IA future).
        La réponse porte `coreServiceAvailable`, résolu SERVEUR depuis
        l'appartenance active : un refus de consentement ne le coupe jamais
        (C16-CONSENT).
      parameters:
        - { $ref: "#/components/parameters/ServerDate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentInput" }
      responses:
        "200":
          description: Consentement à jour + disponibilité du service cœur.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [privacy]
      summary: Lire l'état de consentement du appelant (13.4)
      parameters:
        - { $ref: "#/components/parameters/ServerDate" }
      responses:
        "200":
          description: Consentement + service cœur.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentView" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /privacy/rights-requests:
    post:
      tags: [privacy]
      summary: Ouvrir une demande de droit (18.19)
      description: >
        Le sujet est l'identité résolue SERVEUR (jamais un champ du corps). La
        demande naît `received` ; aucune exécution ici.
      parameters:
        - { $ref: "#/components/parameters/ServerDate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RightsRequestInput" }
      responses:
        "201":
          description: Demande ouverte.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RightsRequestView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /privacy/rights-requests/{requestId}/verifications:
    post:
      tags: [privacy]
      summary: Enregistrer un niveau de vérification proportionnée (18.19)
      description: >
        Au seuil requis pour le type de droit ⇒ `ready`, sinon
        `requires_more_info` — jamais un refus automatique.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/ServerDate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RightsVerificationInput" }
      responses:
        "200":
          description: Demande mise à jour.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RightsRequestView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /privacy/rights-requests/{requestId}/restrictions:
    post:
      tags: [privacy]
      summary: Geler/restreindre une demande pour un motif documenté (18.19)
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/ServerDate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RightsRestrictionInput" }
      responses:
        "200":
          description: Demande gelée (motif daté).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RightsRequestView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /privacy/rights-requests/{requestId}/export:
    post:
      tags: [privacy]
      summary: Exécuter un export personnel FILTRÉ (C16-EXPORT, 18.19)
      description: >
        Anti-IDOR : la demande doit appartenir à l'appelant (sinon 404). La
        vérification doit atteindre le seuil (sinon 403). L'extraction exclut
        structurellement tout champ privé d'un autre membre
        (`thirdPartyPrivateFields = 0`).
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/ServerDate" }
      responses:
        "201":
          description: Reçu d'export filtré.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalExportReceipt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /privacy/rights-requests/{requestId}/erasure:
    post:
      tags: [privacy]
      summary: Exécuter un effacement après vérification (18.10)
      description: >
        Pose un tombstone (append-only en base, 0016) et retire l'identité du
        service cœur. Exige la vérification proportionnée à l'irréversibilité.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/ServerDate" }
      responses:
        "200":
          description: Demande exécutée (effacement posé).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RightsRequestView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /privacy/restore-points:
    post:
      tags: [privacy]
      summary: Prendre un point de restauration (18.10)
      parameters:
        - { $ref: "#/components/parameters/ServerDate" }
      responses:
        "201":
          description: Instantané des identités visibles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestorePointView" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /privacy/restorations:
    post:
      tags: [privacy]
      summary: Restaurer en réappliquant effacements ET révocations (C16-RESTORE)
      description: >
        Restaure depuis le dernier point en réappliquant les effacements
        (tombstones) et les révocations postérieurs avant réouverture : une
        identité effacée après le point reste invisible
        (`deletedIdentityVisible = false`).
      parameters:
        - { $ref: "#/components/parameters/ServerDate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestorationInput" }
      responses:
        "200":
          description: Reçu de restauration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreReceiptView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /metrics/analytics/events:
    post:
      tags: [metrics]
      summary: Journaliser un événement d'analytics pseudonymisé (16.1)
      description: >
        Le domaine REFUSE tout champ financier ou identitaire individuel dans
        `properties` (422 `METRICS_CHAMPS_FINANCIER_INDIVIDUEL`, C18-ANALYTICS)
        et toute étape hors liste fermée. L'horodatage est SERVEUR.
      parameters:
        - { $ref: "#/components/parameters/ServerDate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyticsEventInput" }
      responses:
        "201":
          description: Événement journalisé (sans champ individuel).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsEventView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /metrics/analytics/funnel/{cohortId}:
    get:
      tags: [metrics]
      summary: Entonnoir d'une cohorte, sans champ financier individuel (16.1)
      description: >
        Compte par étape ordonnée. La garde C18-ANALYTICS est exposée : le champ
        `individualFinancialFields` est structurellement `0` (un export n'en porte
        jamais).
      parameters:
        - { $ref: "#/components/parameters/ServerDate" }
        - { $ref: "#/components/parameters/CohortId" }
        - name: groupId
          in: query
          required: false
          description: >
            Groupe porteur de la cohorte. OPTIONNEL pour compatibilité ascendante ;
            EXIGÉ en mode RÉEL (RLS `tenant_isolation` sur `analytics_event`,
            migration `0017_pilot_metrics`) : sans lui l'entonnoir réel est vide.
          schema: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200":
          description: Entonnoir + garde sans champ individuel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsFunnelView" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /metrics/cohorts:
    post:
      tags: [metrics]
      summary: Créer/mettre à jour une cohorte de pilote (18.13)
      description: >
        Un cycle = rotation complète = `memberCount` tours. L'éligibilité « trois
        cycles » est jugée domaine (C18-COHORT : 3 tours / 10 membres ⇒ 0 cycle ⇒
        `eligibleThreeCycleRetention = false`).
      parameters:
        - { $ref: "#/components/parameters/ServerDate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CohortInput" }
      responses:
        "201":
          description: Cohorte enregistrée + éligibilité calculée.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CohortView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /metrics/cohorts/{groupId}:
    get:
      tags: [metrics]
      summary: Lire une cohorte (18.13)
      parameters:
        - { $ref: "#/components/parameters/ServerDate" }
        - { $ref: "#/components/parameters/GroupId" }
      responses:
        "200":
          description: Cohorte.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CohortView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /metrics/economics:
    post:
      tags: [metrics]
      summary: Économie unitaire — paiement réel vs promesse, porte G2 (16.2)
      description: >
        Montants en **XAF entier** renvoyés en chaînes (jamais de flottant). Le
        taux de paiement **réel** gouverne la porte exploratoire G2 (C18-PAYERS :
        2/10 = 20 % < 25 % ⇒ `gateG2Met = false`).
      parameters:
        - { $ref: "#/components/parameters/ServerDate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EconomicsInput" }
      responses:
        "200":
          description: Économie unitaire + état de la porte G2.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EconomicsView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /metrics/risks:
    post:
      tags: [metrics]
      summary: Enregistrer un risque au registre du pilote (16.3)
      description: >
        Sévérité connue, probabilité/impact bornés à [0,100], date de revue
        AAAA-MM-JJ (le domaine juge, 422 sinon).
      parameters:
        - { $ref: "#/components/parameters/ServerDate" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RiskInput" }
      responses:
        "201":
          description: Risque enregistré.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [metrics]
      summary: Lister le registre des risques du pilote (16.3)
      parameters:
        - { $ref: "#/components/parameters/ServerDate" }
      responses:
        "200":
          description: Liste des risques.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RiskView" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /metrics/extension-check:
    post:
      tags: [metrics]
      summary: Contrôle d'extension du pilote (16.3)
      description: >
        Un risque **critique sans contrôle effectif** (contrôle + preuve +
        propriétaire) bloque l'extension : `extensionAllowed = false` et la liste
        des risques bloquants est remontée.
      parameters:
        - { $ref: "#/components/parameters/ServerDate" }
      responses:
        "200":
          description: Statut d'extension du pilote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtensionStatusView" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [metrics]
      summary: Contrôle d'extension du pilote, en lecture (16.3)
      description: >
        Même verdict que le `POST` homonyme, sans corps de requête : c'est la
        forme appelée par le dashboard DIRECTION (`DirectionApi.extensionCheck()`),
        pour aligner le contrat client/serveur sans imposer un POST factice côté
        navigateur.
      parameters:
        - { $ref: "#/components/parameters/ServerDate" }
      responses:
        "200":
          description: Statut d'extension du pilote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtensionStatusView" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /health:
    get:
      tags: [ops]
      operationId: getHealth
      summary: Santé générique (alias docker-compose) — sonde PostgreSQL en mode réel
      description: >
        Mode réel : 200 uniquement si PostgreSQL est joignable (SELECT 1),
        sinon 503 « degraded ». Mode fictif : « ok » honnête sans base.
      responses:
        "200":
          description: API opérationnelle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthView" }
        "503":
          description: Mode réel et PostgreSQL injoignable (dégradé).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /health/live:
    get:
      tags: [ops]
      operationId: getLiveness
      summary: Liveness — le process répond
      responses:
        "200":
          description: Process vivant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthView" }

  /health/ready:
    get:
      tags: [ops]
      operationId: getReadiness
      summary: Readiness — en mode réel, vérifie réellement PostgreSQL (jamais une constante)
      responses:
        "200":
          description: Prêt à servir (mode réel, PostgreSQL joignable ; mode fictif, prêt sans base).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthView" }
        "503":
          description: Mode réel et PostgreSQL injoignable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /access/registrations:
    post:
      tags: [access]
      operationId: requestRegistration
      summary: Demande d'inscription — réponse anti-énumération 202 uniforme (1.1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationRequest" }
      responses:
        "202":
          description: Demande acceptée ; le code part hors bande (email/téléphone).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessReceipt" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /access/registrations/verifications:
    post:
      tags: [access]
      operationId: verifyRegistration
      summary: Vérification du canal par CODE (ADR-0024) puis activation du compte
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationVerification" }
      responses:
        "200":
          description: Compte activé ; état courant du compte renvoyé.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountStateView" }
        "401": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /access/recovery-requests:
    post:
      tags: [access]
      operationId: requestRecovery
      summary: Demande de récupération — gabarit identique compte connu/inconnu (1.4)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryRequest" }
      responses:
        "202":
          description: "Demande acceptée (anti-énumération : même réponse dans tous les cas)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessReceipt" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /access/recovery-completions:
    post:
      tags: [access]
      operationId: completeRecovery
      summary: Achèvement de récupération — jeton à usage unique + révocation de toutes les sessions antérieures (1.4)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryCompletion" }
      responses:
        "200":
          description: Récupération effectuée ; génération de sessions incrémentée.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCompletionView" }
        "401": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /access/operators/{identityId}/privilege:
    get:
      tags: [access]
      operationId: getOperatorPrivilege
      summary: Privilège opérateur RECALCULÉ serveur, jamais depuis le jeton (C02-PRIVILEGE)
      parameters:
        - { name: identityId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Accès opérateur courant (faux pour un compte inconnu).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorPrivilegeView" }

  /access/login-requests:
    post:
      tags: [access]
      operationId: requestLogin
      summary: Demande de connexion RÉELLE (ADR-0024) — active seulement en mode réel
      description: >
        N'existe pas en mode fictif. Réponse anti-énumération 202 uniforme ;
        le code part hors bande uniquement si le compte est actif.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "202":
          description: Demande acceptée (anti-énumération).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessReceipt" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /access/login-completions:
    post:
      tags: [access]
      operationId: completeLogin
      summary: Achèvement de connexion RÉELLE — sessionId généré serveur, jamais fourni par le client
      description: >
        N'existe pas en mode fictif. Le `sessionId` opaque retourné se présente
        ensuite en `Authorization: Bearer <sessionId>`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginCompletion" }
      responses:
        "201":
          description: Session établie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionView" }
        "401": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /groups/{groupId}/mutations:
    post:
      tags: [governance]
      operationId: attemptGroupMutation
      summary: Sonde de mutation gardée par adhésion active + groupe mutable (C03-REVOKE)
      description: >
        En mode réel, l'identité sondée est l'ACTEUR résolu depuis la session
        Bearer : le `identityId` du corps est validé puis ignoré (§14 — le
        client ne choisit jamais son identité métier).
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityIdBody" }
      responses:
        "200":
          description: Mutation acceptée.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMutationReceipt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /groups/{groupId}/contribution-declarations:
    post:
      tags: [contributions]
      operationId: declareGroupContribution
      summary: Déclaration de cotisation — refusée sans acceptation des règles en vigueur
      description: >
        En mode réel, le déclarant testé est l'ACTEUR résolu depuis la session
        Bearer : le `identityId` du corps est validé puis ignoré (§14).
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityIdBody" }
      responses:
        "200":
          description: Déclaration admise (règles courantes acceptées par l'acteur).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContributionDeclarationReceipt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /groups/{groupId}/journal-tamper-tests:
    post:
      tags: [journal]
      operationId: testJournalTamper
      summary: C11-TAMPER — altère une COPIE du journal et la soumet au vérificateur
      description: >
        Lecture seule en mode réel : seule la copie fournie change, la chaîne
        interne réelle reste intacte (re-vérification immédiate exigée à vrai).
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq, amount]
              properties:
                seq: { type: integer, minimum: 1 }
                amount: { type: integer, minimum: 0, maximum: 9007199254740991 }
      responses:
        "200":
          description: Détection constatée sur la copie ; chaîne interne intacte.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TamperTestView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sessionId
      description: |
        Session KÓMBE : en-tête `Authorization: Bearer <sessionId>` où
        `sessionId` est un identifiant opaque généré serveur (haute entropie,
        ADR-0024), jamais un JWT durable de confiance. Le sessionId est obtenu
        par `POST /access/login-completions` (code reçu hors bande) ; l'identité
        métier est ensuite résolue serveur depuis la session — le client ne
        choisit jamais son identité et aucun en-tête `x-actor` n'existe en mode
        réel. Les règles de groupe sont évaluées côté serveur
        (ARCHITECTURE_CIBLE §Frontières).

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string }
    CohortId:
      name: cohortId
      in: path
      required: true
      schema: { type: string }
    CommandId:
      name: commandId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clé d'idempotence ; un rejeu renvoie le résultat d'origine ou un conflit explicite.
      schema: { type: string, minLength: 8, maxLength: 200 }
    ExpectedVersion:
      name: If-Match-Version
      in: header
      required: true
      description: Version d'objet attendue pour toute mutation (concurrence optimiste, 18.2).
      schema: { type: integer, minimum: 1 }
    ServerDate:
      name: x-server-date
      in: header
      required: false
      description: >
        Horodatage SERVEUR injecté pour la recette du squelette (fictif ; C01 le
        résoudra via session + horloge serveur). Une horloge de support ne peut
        JAMAIS être fournie librement par le client : c'est la barrière serveur
        qui juge l'expiration JIT (ADR-0005).
      schema: { type: string, format: date-time }
    ManifestId:
      name: manifestId
      in: path
      required: true
      description: >
        Identifiant du manifeste d'export (C12). Le téléchargement et la
        vérification recontrôlent l'accès à l'acheminement ; un objet hors portée
        répond 404 non-divulgation.
      schema: { type: string }

  schemas:
    Money:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: Montant XAF entier, borné à l'entier sûr JSON. Jamais de flottant.
    ErrorCode:
      type: string
      description: Code d'erreur stable, non divulguant (cf. @kombe/domain errors).
      enum:
        - MONEY_NOT_INTEGER
        - MONEY_NEGATIVE
        - MONEY_OVER_PER_AMOUNT_CEILING
        - MONEY_OVER_SAFE_CEILING
        - ROTATION_MEMBERS_MIN
        - ROTATION_CONTRIBUTION_POSITIVE
        - RESERVATION_INCOHERENTE
        - RECONCILIATION_INCOHERENTE
        - ELECTORATE_INVALIDE
        - VOTE_HORS_LIMITES
        - JOUR_INVALIDE
        - EXPORT_CUTOPE_INVALID
        - EXPORT_IDENTIFIANT_REQUIS
        - PRIVACY_IDENTIFIANT_REQUIS
        - PRIVACY_CONTENU_PLACEHOLDER
        - PRIVACY_CONSENTEMENT_CATEGORIE_INCONNUE
        - PRIVACY_VERIFICATION_INSUFFISANTE
        - PRIVACY_MOTIF_GEL_REQUIS
        - METRICS_IDENTIFIANT_REQUIS
        - METRICS_ETAPE_ANALYTICS_INCONNUE
        - METRICS_CHAMPS_FINANCIER_INDIVIDUEL
        - METRICS_DENOMINATEUR_NUL
        - METRICS_SEVERITE_INCONNUE
        - METRICS_VALEUR_INVALIDE
        - METRICS_RISQUE_CRITIQUE_SANS_CONTROLE
        - FEATURE_PILOT_FORBIDDEN
        - RULE_INVALID
        - RULE_VERSION_IMMUTABLE
        - RULE_ACCEPT_HASH_MISMATCH
        - RULE_RETROACTIVE
        - SCHEDULE_ROUNDS_MISMATCH
        - SCHEDULE_BENEFICIARY_DUPLICATE
        - SCHEDULE_MEMBER_UNKNOWN
        - SCHEDULE_OBLIGATION_DUPLICATE
        - SCHEDULE_FROZEN
        - REPLAY_VERSION_UNKNOWN
        - CHECKPOINT_MISMATCH
        - IDEMPOTENCY_BODY_CONFLICT
        - CONTRIBUTION_EXCEEDS_REMAINING
        - REFERENCE_JUSTIFICATION_REQUIRED
        - CONTRIBUTION_STATE_INVALID
        - CONTRIBUTION_ALREADY_COMPENSATED
        - VALIDATION_BLOCKED_BY_DISPUTE
        - ROUND_CLOSE_BLOCKED_BY_DISPUTE
        - DISPUTE_WINDOW_CLOSED
        - DISPUTE_REASON_REQUIRED
        - DISPUTE_NOT_RESOLVABLE
        - DISPUTE_ALREADY_RESOLVED
        - DISPUTE_RESOLVER_NOT_DESIGNATED
        - DISPUTE_RESOLVER_NOT_INDEPENDENT
        - DISPUTE_RESOLUTION_REQUIRED
    Error:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string, description: Message générique, sans donnée réelle. }
        traceId: { type: string }
    CommandReceipt:
      type: object
      required: [commandId, status]
      properties:
        commandId: { type: string }
        status: { type: string, enum: [queued, applied, rejected, conflict] }
        resultVersion: { type: integer }
        journalEventHash: { type: string, description: SHA-256 de l'événement canonique. }
    Group:
      type: object
      required: [groupId, version]
      properties:
        groupId: { type: string }
        version: { type: integer }
        state: { type: string, enum: [configuration, active, paused, closed] }
        displayName: { type: string, maxLength: 120 }
        tontineModel: { type: string, enum: [famille, collegues, fetes, construction, etudiant, personnalise] }
        rotationType: { type: string, enum: [rotative_fermee, tirage, negocie] }
        parentGroupId: { type: string, nullable: true }
        currency: { type: string, minLength: 3, maxLength: 3 }
        timezone: { type: string, maxLength: 64 }
    CreateGroupRequest:
      type: object
      description: >
        Amorçage d'une tontine (C03, migration 0024). Le `groupId` est une clé
        métier fournie par le contrat ; l'acteur/créateur n'est JAMAIS choisi
        ici — il est résolu serveur depuis la session Bearer (§14). Devise et
        fuseau sont des invariants serveur (XAF / Africa/Douala au pilote) : les
        champs `currency`/`timezone` sont ignorés si absents et refusés si
        incompatibles. Les typologies `tirage`/`negocie` sont reconnues à la
        création mais non démarrables au pilote (échec fermé, P1).
      required: [groupId]
      properties:
        groupId: { type: string, minLength: 1, maxLength: 120 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        tontineModel: { type: string, enum: [famille, collegues, fetes, construction, etudiant, personnalise] }
        rotationType: { type: string, enum: [rotative_fermee, tirage, negocie] }
        parentGroupId: { type: string, minLength: 1, maxLength: 120, description: Groupe parent de supervision (faîtière) ; aucun droit financier dérivé. }
        currency: { type: string, minLength: 3, maxLength: 3 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        minimumMembers: { type: integer, minimum: 2, maximum: 1000 }
        requiredIndependentRoles: { type: integer, minimum: 0, maximum: 10 }
    DiscoverableGroup:
      type: object
      description: >
        Vue publique minimale d'un groupe ouvrable à la découverte (C03 §4.1) :
        nom + modèle + typologie seulement, JAMAIS de registre réel avant
        adhésion (`revealsRegistry` toujours false au pilote).
      required: [groupId, groupName, tontineModel, rotationType, revealsRegistry]
      properties:
        groupId: { type: string }
        groupName: { type: string }
        tontineModel: { type: string, enum: [famille, collegues, fetes, construction, etudiant, personnalise] }
        rotationType: { type: string, enum: [rotative_fermee, tirage, negocie] }
        revealsRegistry: { type: boolean }
    MemberGroupSummary:
      type: object
      description: >
        Projection multi-adhésion d'une tontine pour un membre (C21 §2.5) :
        identité de la tontine + son rôle dans la hiérarchie (parent de
        supervision) + état de l'adhésion. Aucun champ financier ni pouvoir.
      required: [groupId, displayName, tontineModel, rotationType, groupState, parentGroupId, membershipState]
      properties:
        groupId: { type: string }
        displayName: { type: string }
        tontineModel: { type: string, enum: [famille, collegues, fetes, construction, etudiant, personnalise] }
        rotationType: { type: string, enum: [rotative_fermee, tirage, negocie] }
        groupState: { type: string, enum: [configuration, active, paused, closed] }
        parentGroupId: { type: string, nullable: true }
        membershipState: { type: string, enum: [pending, active, departed, revoked] }
    SponsorshipRequest:
      type: object
      description: >
        Demande de parrainage / cooptation (C03 §4.1). Le CANDIDAT est l'acteur
        de session (résolu serveur, §14) — `candidateId` n'est porté ici que
        pour satisfaire le contrat ; `sponsorId` est la CIBLE (membre actif à
        confirmer serveur ; un parrain non actif ou soi-même est refusé).
      required: [sponsorshipId, candidateId, sponsorId]
      properties:
        sponsorshipId: { type: string, minLength: 1, maxLength: 120 }
        candidateId: { type: string, minLength: 1, maxLength: 120 }
        sponsorId: { type: string, minLength: 1, maxLength: 120 }
    SponsorshipDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [endorsed, rejected] }
    Sponsorship:
      type: object
      required: [sponsorshipId, groupId, candidateId, sponsorId, state]
      properties:
        sponsorshipId: { type: string }
        groupId: { type: string }
        candidateId: { type: string }
        sponsorId: { type: string }
        state: { type: string, enum: [requested, endorsed, rejected] }
        createdAt: { type: integer, description: Epoch millis serveur. }
        decidedAt: { type: integer, nullable: true, description: Epoch millis serveur ; null tant que non décidé. }
    Membership:
      type: object
      required: [membershipId, groupId, state]
      properties:
        membershipId: { type: string }
        groupId: { type: string }
        state: { type: string, enum: [pending, active, departed, revoked] }
    InviteMemberRequest:
      type: object
      required: [handle]
      properties:
        handle: { type: string, description: Identifiant logique fictif ; aucun téléphone/nom complet au pilote. }
    RoleNominationRequest:
      type: object
      required: [nominations]
      properties:
        nominations:
          type: array
          minItems: 1
          items:
            type: object
            required: [handle, role]
            properties:
              handle: { type: string }
              role: { type: string, enum: [animator, treasurer, secretary, auditor, member] }
    RoleNomination:
      type: object
      required: [nominationId, groupId, state]
      properties:
        nominationId: { type: string }
        groupId: { type: string }
        state: { type: string, enum: [proposed, accepted, declined] }
    RoleChangeRequest:
      type: object
      required: [requestId, groupId, state]
      properties:
        requestId: { type: string }
        groupId: { type: string }
        state: { type: string, enum: [pending, approved, rejected] }
        approverId: { type: string, description: Doit différer du demandeur (approbateur distinct). }
    DeclareContributionRequest:
      type: object
      required: [obligationId, amount]
      properties:
        obligationId: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
    Contribution:
      type: object
      required: [contributionId, groupId, amount, state, version]
      properties:
        contributionId: { type: string }
        groupId: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        state: { type: string, enum: [declared, validated, rejected, compensated] }
        version: { type: integer }
    OpenVoteRequest:
      type: object
      description: >
        Ouverture d'une proposition/volée (7.1, 18.5). Ni l'électorat NI les
        règles (quorum, version) ne sont fournis ici : l'électorat est scellé
        côté serveur depuis les membres actifs du groupe, et le quorum/version
        des règles sont résolus côté serveur (règles versionnées C04/C05). Un
        client ne choisit jamais son corps électoral ni son quorum (règle 18 /
        ADR-0005). L'identité de l'ouvreur vient de la session résolue serveur,
        jamais du corps. La durée borne l'échéance SERVEUR (ouverture + durée).
      required: [proposalId, subjectKind, subjectRef, reason, durationSeconds]
      properties:
        proposalId: { type: string, maxLength: 120 }
        subjectKind: { type: string, maxLength: 60 }
        subjectRef: { type: string, maxLength: 120 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        durationSeconds: { type: integer, minimum: 1, maximum: 31536000 }
    Vote:
      type: object
      required: [voteId, groupId, electorateSize, state]
      properties:
        voteId: { type: string }
        groupId: { type: string }
        electorateSize: { type: integer, minimum: 1 }
        state: { type: string, enum: [open, closed, executed, cancelled] }
        subjectKind: { type: string }
        subjectRef: { type: string }
        reason: { type: string }
        rulesVersion: { type: integer }
        canonicalHash: { type: string, description: Empreinte RFC 8785 de la proposition (C00). }
        quorumNumerator: { type: integer }
        quorumDenominator: { type: integer }
        openedAt: { type: integer, format: int64 }
        deadline: { type: integer, format: int64, description: Échéance SERVEUR (epoch ms). }
        tally:
          nullable: true
          type: object
          properties:
            yes: { type: integer }
            no: { type: integer }
            abstain: { type: integer }
            turnout: { type: integer }
            quorum: { type: integer }
            approved: { type: boolean }
        closedAt: { type: integer, format: int64, nullable: true }
        effectiveAt: { type: integer, format: int64, nullable: true, description: Date d'effet SERVEUR, jamais rétroactive. }
        executedAt: { type: integer, format: int64, nullable: true }
        cancelReason: { type: string, nullable: true }
        version: { type: integer }

    RuleSet:
      type: object
      description: >
        Instantané **immuable** des règles d'un groupe (C04, 3.1). Scellé par
        `canonicalHash` (RFC 8785). Montant entier kombe_money, jamais de FLOAT.
        Au pilote, `penaltyEnabled` est normalisé à `false` (barre pilote, 6.7).
      required: [memberCount, contribution, rounds, frequency, dueDay, quorum, gracePeriodDays, penaltyEnabled]
      properties:
        memberCount: { type: integer, minimum: 2 }
        contribution: { $ref: "#/components/schemas/Money" }
        rounds: { type: integer, minimum: 1, description: "Tours ; au pilote rounds = memberCount (rotation egale, un beneficiaire par tour)." }
        frequency: { type: string, enum: [monthly, weekly] }
        dueDay: { type: integer, minimum: 1, maximum: 31, description: Jour d'échéance ; borné à la fin de mois via dueDate (C05). }
        quorum:
          type: object
          required: [numerator, denominator]
          description: Quorum borné (numérateur ≤ dénominateur), cf. voteResult.
          properties:
            numerator: { type: integer, minimum: 0 }
            denominator: { type: integer, minimum: 1 }
        gracePeriodDays: { type: integer, minimum: 0 }
        penaltyEnabled: { type: boolean, description: "false force au pilote (penalites fermees, 6.7)." }
    ScheduleBuildRequest:
      type: object
      description: >
        Demande de construction du calendrier d'un cycle (C05, 5.1). `members` et
        `beneficiaryOrder` sont des identifiants **fictifs** ; `contribution` un
        entier XAF. `beneficiaryOrder` doit être une permutation de `members`
        (rotation égale, une part). Dates métier calculées et bornées au dernier
        jour réel du mois ; instants persistés en UTC.
      required: [groupId, ruleVersion, members, contribution, frequency, dueDay, startYear, startMonth, beneficiaryOrder]
      properties:
        groupId: { type: string }
        ruleVersion: { type: integer, minimum: 1 }
        members: { type: array, minItems: 2, items: { type: string } }
        contribution: { $ref: "#/components/schemas/Money" }
        frequency: { type: string, enum: [monthly, weekly] }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        startYear: { type: integer, minimum: 1, maximum: 9999 }
        startMonth: { type: integer, minimum: 1, maximum: 12 }
        beneficiaryOrder: { type: array, minItems: 2, items: { type: string } }
    ObligationView:
      type: object
      description: Dette de cotisation d'un membre pour un tour (obligation unique membre/tour, 5.2).
      properties:
        obligationId: { type: string }
        memberId: { type: string }
        amount: { type: string, description: Montant XAF entier (chaîne). }
        dueDate: { type: string, description: Date métier ISO YYYY-MM-DD (Africa/Douala). }
        dueAtMs: { type: integer, description: Instant UTC en millisecondes. }
        ruleVersion: { type: integer, minimum: 1 }
    ScheduledRoundView:
      type: object
      description: Tour avec bénéficiaire désigné, date d'échéance et obligations.
      properties:
        seq: { type: integer, minimum: 1 }
        beneficiaryId: { type: string }
        dueDate: { type: string }
        dueAtMs: { type: integer }
        roundPot: { type: string }
        obligations: { type: array, items: { $ref: "#/components/schemas/ObligationView" } }
    CycleScheduleView:
      type: object
      description: >
        Calendrier complet d'un cycle ; totaux nés de l'oracle `rotation`
        (`roundPot` = cotisation × N, `cycleExpectedTotal` = total attendu). Les
        montants sont des chaînes (entiers XAF).
      properties:
        groupId: { type: string }
        ruleVersion: { type: integer, minimum: 1 }
        memberCount: { type: integer, minimum: 2 }
        rounds: { type: integer, minimum: 1 }
        frequency: { type: string, enum: [monthly, weekly] }
        state: { type: string, enum: [draft, started] }
        displayTz: { type: string, description: "Fuseau d'affichage contractuel : Africa/Douala." }
        contribution: { type: string }
        roundPot: { type: string }
        cycleExpectedTotal: { type: string, description: "C05-SCHEDULE : 10 membres à 5000 ⇒ 500000." }
        schedule: { type: array, items: { $ref: "#/components/schemas/ScheduledRoundView" } }
    DepartureView:
      type: object
      description: Vue d'un départ — la dette n'est pas réaffectée, les tours non réduits.
      properties:
        departingId: { type: string }
        roundsUnchanged: { type: boolean }
        debtReassigned: { type: boolean }
        retainedObligations: { type: integer, minimum: 0 }
    CycleRenewalRequest:
      type: object
      required: [version, memberCount, contribution, rounds]
      properties:
        version: { type: integer, minimum: 1 }
        memberCount: { type: integer, minimum: 2 }
        contribution: { $ref: "#/components/schemas/Money" }
        rounds: { type: integer, minimum: 1 }
    RenewalPlan:
      type: object
      description: Plan de renouvellement (5.5) — nouvelles acceptations si engagement essentiel changé.
      properties:
        fromRuleVersion: { type: integer }
        toRuleVersion: { type: integer }
        essentialChange: { type: boolean }
        requiresNewAcceptances: { type: boolean }
        historyPreserved: { type: boolean }
    JournalVerifyResult:
      type: object
      description: >
        Résultat de la vérification indépendante de la chaîne (9.2/9.4). En cas de
        rupture, `throughSeq` localise jusqu'où la chaîne est saine ; le `detail`
        reste générique (aucune donnée réelle divulguée).
      required: [intact, throughSeq]
      properties:
        intact: { type: boolean }
        throughSeq: { type: integer, minimum: 0 }
        error:
          type: string
          enum: [EVENT_HASH_MISMATCH, EVENT_CHAIN_BREAK, CHECKPOINT_MISMATCH]
        detail: { type: string }
    Checkpoint:
      type: object
      description: >
        Point de contrôle externe scellé (9.2) — empreinte d'un préfixe de chaîne
        (groupe, séquence, hash de tête). Posé hors des privilèges applicatifs ;
        la table est immuable et en écriture refusée à `kombe_app` (0007).
      required: [groupId, seq, headHash, issuedAt, issuedBy, hash]
      properties:
        groupId: { type: string }
        seq: { type: integer, minimum: 1 }
        headHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        issuedAt: { type: string, format: date-time }
        issuedBy: { type: string }
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
    CheckpointRequest:
      type: object
      required: [issuedBy, issuedAt]
      properties:
        issuedBy: { type: string, maxLength: 120 }
        issuedAt: { type: string, format: date-time }
    TimelineEntry:
      type: object
      description: >
        Entrée de timeline en langage clair (9.3). Le `label` n'est jamais le
        jargon technique brut ; le `summary` n'expose que des champs entiers sûrs.
        Le payload brut d'un événement privé n'apparaît jamais.
      required: [seq, type, label]
      properties:
        seq: { type: integer, minimum: 1 }
        type: { type: string }
        occurredAt:
          type: string
          description: >
            Horodatage SERVEUR de l'événement (jamais client),
            format ISO du journal (date « YYYY-MM-DD » ou datetime ISO).
        label: { type: string }
        summary:
          type: object
          additionalProperties: true
    TimelineView:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
    RebuildResult:
      type: object
      description: Réconciliation replay ↔ projection de référence (C11-REBUILD, 9.5).
      required: [projectionMatches, throughSeq]
      properties:
        projectionMatches: { type: boolean }
        throughSeq: { type: integer, minimum: 0 }
    ContributionDeclaration:
      type: object
      description: >
        Corps sémantique d'une déclaration partielle (6.1). Le montant est un
        entier XAF (jamais de flottant) ; `allegedDate` est la date affirmée par
        le client, distincte de la date serveur. Une preuve électronique sans
        `reference` exige un `justification` non vide ; une référence ne vaut
        jamais preuve authentifiée.
      required: [obligationId, amount, channel, allegedDate]
      properties:
        obligationId: { type: string, minLength: 1 }
        amount: { $ref: "#/components/schemas/Money" }
        channel: { type: string, enum: [cash, electronic] }
        reference: { type: string, minLength: 1, maxLength: 120 }
        justification: { type: string, minLength: 1, maxLength: 500 }
        allegedDate: { type: string, format: date }
    DeclarationReceipt:
      type: object
      description: >
        Reçu d'une déclaration (première application ou rejeu idempotent). Les
        montants sont rendus en chaînes pour préserver l'entier au-delà de JSON
        number ; `status` distingue `applied` (201) de `duplicate` (rejeu, 200).
      required: [status, commandId, obligationId, remainingDue, availableToDeclare]
      properties:
        status: { type: string, enum: [applied, duplicate] }
        commandId: { type: string }
        obligationId: { type: string }
        resultVersion: { type: integer, minimum: 1 }
        eventHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        remainingDue: { type: string, description: dû − validé net (entier en chaîne). }
        availableToDeclare: { type: string, description: dû − réservations actives (entier en chaîne). }
    DraftReceipt:
      type: object
      description: Accusé d'un brouillon — aucun événement, aucune réservation, aucune soumission.
      required: [draftSaved, submitted, obligationId]
      properties:
        draftSaved: { type: boolean }
        submitted: { type: boolean }
        obligationId: { type: string }
    ContributionObligationView:
      type: object
      description: >
        Solde d'une obligation en lecture seule (18.3). Montants en chaînes
        (entiers). `remainingDue` naît du validé net, `availableToDeclare` de la
        capacité sous verrou (dû − réservations).
      required: [obligationId, groupId, due, validatedNet, activeReserved, remainingDue, availableToDeclare, version]
      properties:
        obligationId: { type: string }
        groupId: { type: string }
        due: { type: string }
        validatedNet: { type: string }
        activeReserved: { type: string }
        remainingDue: { type: string }
        availableToDeclare: { type: string }
        version: { type: integer, minimum: 1 }

    ValidationActReceipt:
      type: object
      description: >
        Reçu d'un acte de validation (confirmation, contrôle ou rejet). Les
        échecs d'indépendance ou d'anti-cumul répondent 200 avec
        `validationAccepted = false` et un `reason` stable, SANS écriture ; les
        violations d'état/de droits/version lèvent un 4xx.
      required: [validationAccepted, validationCompleted, contributionId, state, version]
      properties:
        validationAccepted: { type: boolean }
        validationCompleted: { type: boolean }
        contributionId: { type: string }
        state: { type: string, enum: [declared, confirmed, validated, rejected, compensated] }
        version: { type: integer, minimum: 1 }
        reason: { type: string, description: Stable (SELF_DECLARANT, ACTOR_ALREADY_ACTED, AWAITING_CONTROLLERS) le cas échéant. }
        eventHash: { type: string, pattern: "^[0-9a-f]{64}$" }
    CompensationRequest:
      type: object
      description: Demande de compensation liée — identifiant de la contre-écriture à poser.
      required: [reversalContributionId]
      properties:
        reversalContributionId: { type: string, minLength: 1, maxLength: 120 }
    CompensationReceipt:
      type: object
      description: Reçu de compensation — contre-écriture appliquée au plus une fois par original.
      required: [reversalAccepted, reversalCount, contributionId, reversalContributionId, state, version]
      properties:
        reversalAccepted: { type: boolean }
        reversalCount: { type: integer, minimum: 0 }
        contributionId: { type: string }
        reversalContributionId: { type: string }
        state: { type: string, enum: [declared, confirmed, validated, rejected, compensated] }
        version: { type: integer, minimum: 1 }
        eventHash: { type: string, pattern: "^[0-9a-f]{64}$" }
    ContributionValidationView:
      type: object
      description: >
        Vue de validation d'une cotisation en lecture seule. Montant en chaîne
        (entier). `compensated`/`reversalCount` résument la correction (6.6).
      required: [contributionId, obligationId, groupId, amount, declarantIdentityId, state, requiredControllers, confirmerIdentityId, controllerIdentityIds, compensated, reversalCount, version]
      properties:
        contributionId: { type: string }
        obligationId: { type: string }
        groupId: { type: string }
        amount: { type: string }
        declarantIdentityId: { type: string }
        state: { type: string, enum: [declared, confirmed, validated, rejected, compensated] }
        requiredControllers: { type: integer, minimum: 0 }
        confirmerIdentityId: { type: [string, "null"] }
        controllerIdentityIds: { type: array, items: { type: string } }
        compensated: { type: boolean }
        reversalCount: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
    DisputeRequest:
      type: object
      description: >
        Ouverture d'un litige (6.5). `reason` obligatoire et non vide ;
        `category` ordinaire bornée à 7 jours après notification (fraude /
        erreur grave exemptées). Horodatages en secondes since epoch.
      required: [disputeId, obligationId, reason, category, notifiedAt, raisedAt]
      properties:
        disputeId: { type: string }
        obligationId: { type: string }
        reason: { type: string, maxLength: 500 }
        category: { type: string, enum: [ordinary, fraud, serious_error] }
        notifiedAt: { type: integer, minimum: 0 }
        raisedAt: { type: integer, minimum: 0 }
    DisputeReceipt:
      type: object
      required: [disputeId, groupId, obligationId, category, state]
      properties:
        disputeId: { type: string }
        groupId: { type: string }
        obligationId: { type: string }
        category: { type: string, enum: [ordinary, fraud, serious_error] }
        state: { type: string, enum: [open, resolved, reopened] }
    DependentOperationReceipt:
      type: object
      description: Sonde d'opération dépendante — autorisée seulement si aucun litige ouvert.
      required: [obligationId, allowed]
      properties:
        obligationId: { type: string }
        allowed: { type: boolean }

    # ── C10 — Litiges et recours (8.1 → 8.4) : AUCUN champ monétaire ─────────
    DisputeCaseRequest:
      type: object
      description: >
        Ouverture d'un dossier (8.1). `reason` ET `requestedCorrection` non
        vides ; `raisedBy` résolu serveur (absent ici) ; pièces désactivées
        (aucun champ). Aucun montant.
      required: [disputeId, obligationId, reason, requestedCorrection, category, notifiedAt, raisedAt]
      properties:
        disputeId: { type: string, maxLength: 120 }
        obligationId: { type: string, maxLength: 120 }
        reason: { type: string, maxLength: 500 }
        requestedCorrection: { type: string, maxLength: 500 }
        category: { type: string, enum: [ordinary, fraud, serious_error] }
        involvedIdentityIds: { type: array, maxItems: 20, items: { type: string, maxLength: 120 } }
        notifiedAt: { type: integer, minimum: 0 }
        raisedAt: { type: integer, minimum: 0 }
    DisputeCommonView:
      type: object
      description: >
        Vue COMMUNE (8.1) — `existence / statut / issue utile`, visible de tout
        membre du groupe. Ne porte NI motif, NI correction demandée, NI
        identité de partie (garde structurelle C10-PRIVACY).
      required: [disputeId, obligationId, category, state, raisedAt]
      properties:
        disputeId: { type: string }
        obligationId: { type: string }
        category: { type: string, enum: [ordinary, fraud, serious_error] }
        state: { type: string, enum: [open, resolved] }
        outcome: { type: string, nullable: true }
        raisedAt: { type: integer, minimum: 0 }
        resolvedAt: { type: integer, minimum: 0, nullable: true }
        reopenCount: { type: integer, minimum: 0 }
    DisputeRecord:
      type: object
      description: >
        Détail COMPLET, réservé aux parties (levant, impliqués, résolveurs
        désignés). Les écritures de compensation sont des RÉFÉRENCES posées via
        C07/C08, jamais des montants.
      required: [disputeId, groupId, obligationId, category, raisedBy, reason, requestedCorrection, state]
      properties:
        disputeId: { type: string }
        groupId: { type: string }
        obligationId: { type: string }
        category: { type: string, enum: [ordinary, fraud, serious_error] }
        raisedBy: { type: string }
        reason: { type: string }
        requestedCorrection: { type: string }
        involvedIdentityIds: { type: array, items: { type: string } }
        resolverIdentityIds: { type: array, items: { type: string } }
        notifiedAt: { type: integer, minimum: 0 }
        raisedAt: { type: integer, minimum: 0 }
        state: { type: string, enum: [open, resolved] }
        outcome: { type: string, nullable: true }
        resolvedBy: { type: string, nullable: true }
        resolvedAt: { type: integer, minimum: 0, nullable: true }
        correctionContributionIds: { type: array, items: { type: string } }
        reopenedFromDisputeId: { type: string, nullable: true }
        reopenCount: { type: integer, minimum: 0 }
    ResolversRequest:
      type: object
      description: Désignation des résolveurs (8.2) — liste non vide, aucun impliqué.
      required: [resolverIdentityIds]
      properties:
        resolverIdentityIds: { type: array, minItems: 1, maxItems: 10, items: { type: string, maxLength: 120 } }
    DisputeResolutionRequest:
      type: object
      description: >
        Résolution (8.3) — `outcome` documenté non vide ; les
        `correctionContributionIds` RÉFÉRENCENT des écritures C07/C08 (aucun
        montant).
      required: [outcome, resolvedAt]
      properties:
        outcome: { type: string, maxLength: 500 }
        resolvedAt: { type: integer, minimum: 0 }
        correctionContributionIds: { type: array, maxItems: 10, items: { type: string, maxLength: 120 } }
    RoundCloseRequest:
      type: object
      description: Sonde de clôture d'un tour (C10-FREEZE) — obligations, pas de montant.
      required: [obligationIds]
      properties:
        obligationIds: { type: array, minItems: 1, maxItems: 50, items: { type: string, maxLength: 120 } }
    DisputeActReceipt:
      type: object
      description: Reçu d'acte sur dossier (désignation / résolution / recours).
      required: [record, version]
      properties:
        record: { $ref: "#/components/schemas/DisputeRecord" }
        version: { type: integer, minimum: 1 }
    RoundCloseReceipt:
      type: object
      description: Clôture normale admise (aucun litige ouvert) — sans écriture.
      required: [normalCloseAccepted]
      properties:
        normalCloseAccepted: { type: boolean, enum: [true] }

    # ── C17 : console support ──
    SupportAccessRequestInput:
      type: object
      additionalProperties: false
      required: [requestId, targetGroupId, motif, permissions, ttlSeconds]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 120 }
        targetGroupId: { type: string, minLength: 1, maxLength: 120 }
        motif: { type: string, minLength: 1, maxLength: 500 }
        # Permissions laissées ouvertes au schéma : la politique (refus financier
        # /inconnu) est DÉTENUE par le domaine, jamais ici.
        permissions:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 40 }
        ttlSeconds: { type: integer, minimum: 60, maximum: 86400 }
    SupportApprovalInput:
      type: object
      additionalProperties: false
      required: [ttlSeconds]
      properties:
        ttlSeconds: { type: integer, minimum: 60, maximum: 86400 }
    SupportActionInput:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, minLength: 1, maxLength: 40 }
    SupportAccessView:
      type: object
      additionalProperties: false
      required: [requestId, applicantIdentityId, targetGroupId, motif, permissions, approverCount, requiredApprovals, requestedAt, status, version]
      properties:
        requestId: { type: string }
        applicantIdentityId: { type: string }
        targetGroupId: { type: string }
        motif: { type: string }
        permissions:
          type: array
          items:
            type: string
            enum: [view_trace, restore_access, explain_journal]
        approverCount: { type: integer, minimum: 0 }
        requiredApprovals: { type: integer, minimum: 2 }
        requestedAt: { type: integer, format: int64 }
        expiresAt: { type: [integer, 'null'], format: int64 }
        status:
          type: string
          enum: [pending_approval, granted, expired, revoked]
        version: { type: integer, minimum: 1 }
    SupportActionReceipt:
      type: object
      additionalProperties: false
      required: [requestId, action, groupId, accessAllowed, version]
      properties:
        requestId: { type: string }
        action: { type: string }
        groupId: { type: string }
        accessAllowed: { type: boolean, enum: [true] }
        version: { type: integer, minimum: 1 }

    StatementExportInput:
      type: object
      additionalProperties: false
      description: >
        Corps optionnel de génération d'export. La coupure, si fournie, doit
        rester inférieure ou égale à l'état courant du journal (bornée SERVEUR).
      properties:
        cutoffSequence: { type: integer, minimum: 0, maximum: 10000000 }
    ExportManifestView:
      type: object
      additionalProperties: false
      required: [manifestId, groupId, cutoffSequence, generatorVersion, capturedAt, pdfSha256, csvSha256, prudentNotice, downloadPath]
      properties:
        manifestId: { type: string }
        groupId: { type: string }
        cutoffSequence: { type: integer, minimum: 0 }
        generatorVersion: { type: string }
        capturedAt: { type: string, format: date-time }
        pdfSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        csvSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        prudentNotice:
          type: string
          description: >
            Mention prudente obligatoire : « historique vérifiable », jamais de
            promesse de valeur légale ni de signature (10.3).
        downloadPath: { type: string }
    ExportVerificationInput:
      type: object
      additionalProperties: false
      required: [bytesBase64]
      description: Octets du fichier détenu par le client, encodés en base64.
      properties:
        bytesBase64: { type: string }
    ExportVerificationResult:
      type: object
      additionalProperties: false
      required: [verification_passed, checkedHash, expectedHash]
      properties:
        verification_passed: { type: boolean }
        checkedHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        expectedHash: { type: string, pattern: '^[0-9a-f]{64}$' }

    LegalNoticeInput:
      type: object
      additionalProperties: false
      required: [noticeId, kind, version, lastUpdatedAt, body]
      properties:
        noticeId: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [cgu, privacy, cookies, contact, complaint] }
        version: { type: string, minLength: 1, maxLength: 60 }
        lastUpdatedAt:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Date ISO (AAAA-MM-JJ) de dernière mise à jour, affichée sur la page.
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: >
            Corps publiable : ni placeholder (« bientôt », « TBD », …) ni promesse
            de garantie des fonds ou de preuve légale (mention prudente).
    LegalNoticeView:
      type: object
      additionalProperties: false
      required: [noticeId, kind, version, lastUpdatedAt, body]
      properties:
        noticeId: { type: string }
        kind: { type: string, enum: [cgu, privacy, cookies, contact, complaint] }
        version: { type: string }
        lastUpdatedAt: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        body: { type: string }
    ProcessingRecordInput:
      type: object
      additionalProperties: false
      required: [purpose, dataCategories, legalBasis, country, retentionDays]
      properties:
        purpose: { type: string, minLength: 1, maxLength: 300 }
        dataCategories:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 60 }
        legalBasis:
          type: string
          enum: [contract, consent, legal_obligation, vital_interest, public_task, legitimate_interest]
        recipients:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 120 }
        country: { type: string, minLength: 1, maxLength: 60 }
        retentionDays:
          type: integer
          minimum: 1
          maximum: 36500
          description: Durée de conservation en jours entiers (jamais de flottant, jamais vide).
    ProcessingRecordView:
      type: object
      additionalProperties: false
      required: [purpose, dataCategories, legalBasis, recipients, country, retentionDays]
      properties:
        purpose: { type: string }
        dataCategories: { type: array, items: { type: string } }
        legalBasis:
          type: string
          enum: [contract, consent, legal_obligation, vital_interest, public_task, legitimate_interest]
        recipients: { type: array, items: { type: string } }
        country: { type: string }
        retentionDays: { type: integer, minimum: 1 }
    ConsentInput:
      type: object
      additionalProperties: false
      required: [category, granted]
      description: >
        Catégories strictement facultatives. Le service cœur n'est pas une
        catégorie : sa disponibilité est résolue serveur, jamais gated par ici.
      properties:
        category: { type: string, enum: [research, marketing, future_ai] }
        granted: { type: boolean }
    ConsentView:
      type: object
      additionalProperties: false
      required: [identityId, research, marketing, futureAi, coreServiceAvailable]
      properties:
        identityId: { type: string }
        research: { type: boolean }
        marketing: { type: boolean }
        futureAi: { type: boolean }
        coreServiceAvailable:
          type: boolean
          description: >
            Résolu SERVEUR depuis l'appartenance active : un refus de consentement
            facultatif ne le coupe jamais (C16-CONSENT).
    RightsRequestInput:
      type: object
      additionalProperties: false
      required: [requestId, kind]
      description: Le sujet est l'identité résolue serveur, jamais un champ du corps.
      properties:
        requestId: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [access, export, erasure, rectification, objection] }
    RightsRequestView:
      type: object
      additionalProperties: false
      required: [requestId, subjectIdentityId, kind, status, verificationLevel, requiredVerification, restrictionReason, version]
      properties:
        requestId: { type: string }
        subjectIdentityId: { type: string }
        kind: { type: string, enum: [access, export, erasure, rectification, objection] }
        status:
          type: string
          enum: [received, requires_more_info, ready, fulfilled, frozen]
        verificationLevel: { type: integer, minimum: 0 }
        requiredVerification: { type: integer, minimum: 0 }
        restrictionReason: { type: [string, "null"] }
        version: { type: integer, minimum: 1 }
    RightsVerificationInput:
      type: object
      additionalProperties: false
      required: [level]
      properties:
        level: { type: integer, minimum: 0, maximum: 5 }
    RightsRestrictionInput:
      type: object
      additionalProperties: false
      required: [reason]
      description: Motif obligatoire pour geler (jamais de refus automatique sans motif daté).
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    PersonalField:
      type: object
      additionalProperties: false
      required: [key, ownerIdentityId, visibility, value]
      properties:
        key: { type: string }
        ownerIdentityId: { type: string }
        visibility: { type: string, enum: [private, shared, public] }
        value: { type: string }
    PersonalExportReceipt:
      type: object
      additionalProperties: false
      required: [subjectIdentityId, entries, thirdPartyPrivateFields, prudentNotice]
      properties:
        subjectIdentityId: { type: string }
        entries: { type: array, items: { $ref: "#/components/schemas/PersonalField" } }
        thirdPartyPrivateFields:
          type: integer
          minimum: 0
          description: >
            Doit être structurellement 0 : l'extraction exclut tout champ privé
            d'un autre membre (C16-EXPORT).
        prudentNotice: { type: string }
    RestorePointView:
      type: object
      additionalProperties: false
      required: [takenAt, identities]
      properties:
        takenAt: { type: integer, format: int64, description: Horodatage serveur (secondes d'époque). }
        identities: { type: array, items: { type: string } }
    RestorationInput:
      type: object
      additionalProperties: false
      required: [probeIdentityId]
      properties:
        probeIdentityId: { type: string, minLength: 1, maxLength: 120 }
    RestoreReceiptView:
      type: object
      additionalProperties: false
      required: [visible, reAppliedErasures, reAppliedRevocations, deletedIdentityVisible]
      properties:
        visible: { type: array, items: { type: string } }
        reAppliedErasures: { type: integer, minimum: 0 }
        reAppliedRevocations: { type: array, items: { type: string } }
        deletedIdentityVisible:
          type: boolean
          description: >
            False si l'identité sonde a ete effacee apres le point : la restauration
            reapplique les effacements (C16-RESTORE).

    MoneyInput:
      oneOf:
        - { type: string, pattern: '^\d+$' }
        - { type: integer, minimum: 0 }
      description: >
        Montant XAF entier accepté en chaîne de chiffres ou entier ; transformé
        en bigint serveur. Jamais de flottant, jamais de négatif (ADR-0002).
    AnalyticsEventInput:
      type: object
      additionalProperties: false
      required: [cohortId, step]
      properties:
        cohortId: { type: string, minLength: 1, maxLength: 120 }
        groupId:
          type: string
          minLength: 1
          maxLength: 120
          description: >
            Groupe porteur de la cohorte. OPTIONNEL pour compatibilité ascendante
            (le store fictif en mémoire l'ignore) ; EXIGÉ en mode RÉEL : la table
            `analytics_event.group_id` est NOT NULL + FK `"group"` et la RLS
            `tenant_isolation` filtre sur `kombe.group_id` (migration
            `0017_pilot_metrics`). Sans lui, aucune persistance réelle n'est
            possible (jamais de groupe deviné).
        step:
          type: string
          enum:
            - visite
            - demarrage
            - regles_crees
            - invitations
            - membres_acceptes
            - premiere_contribution
            - premiere_validation
            - cycle_termine
            - paiement_abonnement
        properties:
          type: object
          description: >
            Propriétés plates (valeurs primitives). Toute clé financière ou
            identitaire individuelle est REFUSÉE par le domaine (C18-ANALYTICS).
          additionalProperties:
            oneOf:
              - { type: string, maxLength: 200 }
              - { type: integer }
              - { type: boolean }
    AnalyticsEventView:
      type: object
      additionalProperties: false
      required: [eventId, cohortId, step, occurredAt, properties]
      properties:
        eventId: { type: string }
        cohortId: { type: string }
        step: { type: string }
        occurredAt:
          type: integer
          format: int64
          description: Horodatage SERVEUR (secondes d'époque), jamais client.
        properties: { type: object, additionalProperties: true }
    AnalyticsFunnelView:
      type: object
      additionalProperties: false
      required: [cohortId, steps, individualFinancialFields]
      properties:
        cohortId: { type: string }
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [step, count]
            properties:
              step: { type: string }
              count: { type: integer, minimum: 0 }
        individualFinancialFields:
          type: integer
          minimum: 0
          description: >
            Garde C18-ANALYTICS : structurellement 0 — un export ne porte aucun
            champ financier individuel.
    CohortInput:
      type: object
      additionalProperties: false
      required: [groupId, memberCount, roundsCompleted]
      properties:
        groupId: { type: string, minLength: 1, maxLength: 120 }
        memberCount: { type: integer, minimum: 1, maximum: 1000 }
        roundsCompleted: { type: integer, minimum: 0, maximum: 100000 }
    CohortView:
      type: object
      additionalProperties: false
      required: [groupId, memberCount, roundsCompleted, completedCycles, eligibleThreeCycleRetention]
      properties:
        groupId: { type: string }
        memberCount: { type: integer, minimum: 1 }
        roundsCompleted: { type: integer, minimum: 0 }
        completedCycles:
          type: integer
          minimum: 0
          description: Un cycle = rotation complète = memberCount tours.
        eligibleThreeCycleRetention:
          type: boolean
          description: >
            Vrai seulement si >= 3 cycles complets (C18-COHORT : 3 tours / 10
            membres ⇒ 0 cycle ⇒ false).
    EconomicsInput:
      type: object
      additionalProperties: false
      required:
        [exposedMembers, paidCount, promisedCount, supportMinutes,
         supportCostPerMinuteMinor, infrastructureCostMinor, cancellations, taxesMinor]
      properties:
        exposedMembers: { type: integer, minimum: 0 }
        paidCount: { type: integer, minimum: 0 }
        promisedCount: { type: integer, minimum: 0 }
        supportMinutes: { type: integer, minimum: 0 }
        supportCostPerMinuteMinor: { $ref: "#/components/schemas/MoneyInput" }
        infrastructureCostMinor: { $ref: "#/components/schemas/MoneyInput" }
        cancellations: { type: integer, minimum: 0 }
        taxesMinor: { $ref: "#/components/schemas/MoneyInput" }
    EconomicsView:
      type: object
      additionalProperties: false
      required:
        [exposedMembers, realPayers, promisedOnly, paymentRealPercent, gateG2Met,
         supportMinutes, supportCostMinor, infrastructureCostMinor, cancellations,
         taxesMinor, totalCostMinor]
      properties:
        exposedMembers: { type: integer, minimum: 0 }
        realPayers: { type: integer, minimum: 0 }
        promisedOnly: { type: integer, minimum: 0 }
        paymentRealPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Taux de paiement RÉEL (promesses exclues), arrondi à la baisse.
        gateG2Met:
          type: boolean
          description: >
            Vrai si paymentRealPercent >= 25 (seuil exploratoire ; C18-PAYERS :
            2/10 = 20 % ⇒ false).
        supportMinutes: { type: integer, minimum: 0 }
        supportCostMinor: { type: string, pattern: '^\d+$' }
        infrastructureCostMinor: { type: string, pattern: '^\d+$' }
        cancellations: { type: integer, minimum: 0 }
        taxesMinor: { type: string, pattern: '^\d+$' }
        totalCostMinor:
          type: string
          pattern: '^\d+$'
          description: >
            Coût total XAF entier (= support + infrastructure + taxes), sérialisé
            en chaîne (bigint non serialisable en JSON) — jamais de flottant.
    RiskInput:
      type: object
      additionalProperties: false
      required: [riskId, severity, probabilityPercent, impactPercent, reviewedAt]
      properties:
        riskId: { type: string, minLength: 1, maxLength: 120 }
        severity:
          type: string
          enum: [faible, moyen, eleve, critique]
        probabilityPercent: { type: integer, minimum: 0, maximum: 100 }
        impactPercent: { type: integer, minimum: 0, maximum: 100 }
        control: { type: string, maxLength: 500, default: "" }
        evidenceRef: { type: string, maxLength: 300, default: "" }
        owner: { type: string, maxLength: 120, default: "" }
        reviewedAt: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        residual: { type: string, maxLength: 500, default: "" }
    RiskView:
      type: object
      additionalProperties: false
      required: [riskId, severity, probabilityPercent, impactPercent, reviewedAt]
      properties:
        riskId: { type: string }
        severity: { type: string }
        probabilityPercent: { type: integer, minimum: 0, maximum: 100 }
        impactPercent: { type: integer, minimum: 0, maximum: 100 }
        control: { type: string }
        evidenceRef: { type: string }
        owner: { type: string }
        reviewedAt: { type: string }
        residual: { type: string }
    ExtensionStatusView:
      type: object
      additionalProperties: false
      required: [extensionAllowed, criticalWithoutControl]
      properties:
        extensionAllowed:
          type: boolean
          description: >
            Faux si au moins un risque critique n'a pas de contrôle effectif
            (contrôle + preuve + propriétaire) — blocage d'extension (16.3).
        criticalWithoutControl:
          type: array
          items: { type: string }
          description: Identifiants des risques critiques sans contrôle effectif.

    HealthView:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready, degraded] }
        mode: { type: string, enum: [fictif, réel] }

    RegistrationRequest:
      type: object
      required: [identityId, channel]
      properties:
        identityId: { type: string, minLength: 1, maxLength: 120 }
        channel: { type: string, enum: [email, phone] }

    RegistrationVerification:
      type: object
      required: [identityId, code]
      properties:
        identityId: { type: string, minLength: 1, maxLength: 120 }
        code: { type: string, minLength: 4, maxLength: 20 }

    RecoveryRequest:
      type: object
      required: [identityId]
      properties:
        identityId: { type: string, minLength: 1, maxLength: 120 }

    RecoveryCompletion:
      type: object
      required: [identityId, code]
      properties:
        identityId: { type: string, minLength: 1, maxLength: 120 }
        code: { type: string, minLength: 4, maxLength: 20 }
        suspensionSeconds: { type: integer, minimum: 1, maximum: 86400 }

    LoginRequest:
      type: object
      required: [identityId]
      properties:
        identityId: { type: string, minLength: 1, maxLength: 120 }

    LoginCompletion:
      type: object
      required: [identityId, code]
      properties:
        identityId: { type: string, minLength: 1, maxLength: 120 }
        code: { type: string, minLength: 4, maxLength: 20 }

    AccessReceipt:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean, enum: [true] }

    AccountStateView:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [pending_verification, active, suspended, closed] }

    RecoveryCompletionView:
      type: object
      required: [sessionGeneration, recoveryLockUntil]
      properties:
        sessionGeneration: { type: integer, format: int64 }
        recoveryLockUntil: { type: integer, format: int64, nullable: true }

    SessionView:
      type: object
      required: [sessionId, expiresAt]
      properties:
        sessionId: { type: string, description: Identifiant opaque généré serveur (jamais fourni par le client). }
        expiresAt: { type: integer, format: int64, description: "Horodatage serveur (ms d'époque), jamais client." }

    OperatorPrivilegeView:
      type: object
      required: [operator_access]
      properties:
        operator_access: { type: boolean }

    IdentityIdBody:
      type: object
      required: [identityId]
      properties:
        identityId: { type: string, minLength: 1, maxLength: 120 }
      description: >
        En mode réel, l'identité du corps est IGNORÉE : l'acteur est résolu
        serveur depuis la session Bearer (§14 — le client ne choisit jamais son
        identité métier).

    GroupMutationReceipt:
      type: object
      required: [mutation_accepted]
      properties:
        mutation_accepted: { type: boolean, enum: [true] }

    ContributionDeclarationReceipt:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean, enum: [true] }

    TamperTestView:
      type: object
      required: [tamper_detected, error, internal_chain_intact]
      properties:
        tamper_detected: { type: boolean }
        error: { type: string, nullable: true }
        internal_chain_intact: { type: boolean }

  responses:
    Forbidden:
      description: Accès refusé sans divulgation (RBAC objet / IDOR / feature pilote fermée)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Ressource absente ou hors portée de l'acteur (non-divulgation)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflit d'idempotence ou de version (écrasement silencieux interdit)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Violation d'invariant de domaine
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
