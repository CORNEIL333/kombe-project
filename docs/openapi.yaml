  responses:
    Forbidden:
      description: Accès refusé sans divulgation (RBAC objet / IDOR / feature pilote fermée)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Ressource absente ou hors portée de l'acteur (non-divulgation)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflit d'idempotence ou de version (écrasement silencieux interdit)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Violation d'invariant de domaine
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Session absente, expirée ou révoquée (SESSION_INVALID)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gone:
      description: Code d'invitation inconnu, expiré, révoqué ou épuisé (INVITATION_INVALID)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
