packages:
  - "packages/*"
  - "apps/*"
  # App mobile Flutter : n'est PAS un paquet npm (pas de package.json) et ne doit
  # jamais être attrapé par `pnpm -r build/test`. Exclusion explicite et défensive.
  - "!packages/mobile"

# KÓMBE C00 — paramètres de construction et d'exécution (pnpm >= 11 lit les
# réglages non-auth ici, plus dans .npmrc). Politique sécurité H13 / RA08 :
# aucun script de build de dépendance n'est exécuté automatiquement.
# esbuild fournit son binaire via un paquet optionnel précompilé ; son
# postinstall est explicitement refusé (allowBuilds: esbuild: false), et
# strictDepBuilds=false évite qu'un build ignoré fasse échouer l'installation.
allowBuilds:
  esbuild: false
strictDepBuilds: false
ignoreScripts: true
verifyDepsBeforeRun: false
