# KÓMBE — pile de déploiement locale / hôte Docker (socle déployable).
#
# HONNÊTETÉ (à lire) :
#   * `api` + `worker` sont RÉELS dès que leur URL de base est fournie : l'API
#     passe en mode PG (stores Pg*, sessions Bearer, RLS kombe_app) et le worker
#     consomme l'outbox sous rôle kombe_worker. SANS `KOMBE_API_DATABASE_URL`,
#     l'API démarre en mode fictif en mémoire — c'est un état de repli explicite,
#     pas un backend de production. `KOMBE_API_DATABASE_URL` (lue par
#     packages/api/src/db/pgPool.ts) est donc OBLIGATOIRE pour un déploiement
#     réel : ne pas la confondre avec `KOMBE_DATABASE_URL` (rôle migrateur,
#     lue par packages/db/scripts/migrate.mjs uniquement).
#   * `postgres` + `migrate` + `dbtest` sont RÉELS : ils appliquent le schéma
#     (provision + 0001→0023 + grants) et exécutent les preuves base réelle
#     (RLS/verrous/pool/outbox) dès que Docker est disponible.
#
# Démarrage :  docker compose up --build            (postgres + api + worker)
# Migrations : docker compose --profile tools run --rm migrate
# Preuve base réelle : docker compose --profile test run --rm dbtest

name: kombe

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kombe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kombe_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-kombe}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/provision/docker-init.sql:/docker-entrypoint-initdb.d/99-create-test-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432"   # exposition locale uniquement (jamais 0.0.0.0 en dev)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kombe} -d ${POSTGRES_DB:-kombe}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API Fastify : RÉELLE quand KOMBE_API_DATABASE_URL est posée (mode PG :
  # stores persistants, sessions Bearer, RLS kombe_app par transaction). Le
  # rôle est assumé via `-c role=kombe_app` (pgPool.ts) ; le user de connexion
  # est le superuser local `kombe` (membre via provision/roles.sql + droit
  # superuser), équivalent Docker du neondb_owner de Neon.
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      KOMBE_API_DATABASE_URL: postgresql://${POSTGRES_USER:-kombe}:${POSTGRES_PASSWORD:-kombe_dev_only}@postgres:5432/${POSTGRES_DB:-kombe}
    ports:
      - "127.0.0.1:3000:3000"   # exposition locale uniquement
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Worker outbox (C13) : consomme l'outbox sous rôle kombe_worker, découvre
  # les groupes via kombe_c13_pending_groups() (SECURITY DEFINER 0023), santé
  # HTTP sur /health. Canal push externe : aucun prestataire au socle → rejets
  # tracés CHANNEL_NOT_VERIFIED (jamais de faux envoi). Sans
  # KOMBE_WORKER_DATABASE_URL le service sort en erreur (fail-loud), jamais de
  # boucle fictive.
  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WORKER_PORT: "3001"
      WORKER_POLL_MS: "1000"
      KOMBE_WORKER_DATABASE_URL: postgresql://${POSTGRES_USER:-kombe}:${POSTGRES_PASSWORD:-kombe_dev_only}@postgres:5432/${POSTGRES_DB:-kombe}
    command: ["node", "packages/worker/dist/main.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # One-shot d'application du schéma (idempotent, suit les jalons kombe_migration).
  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KOMBE_DATABASE_URL: postgresql://${POSTGRES_USER:-kombe}:${POSTGRES_PASSWORD:-kombe_dev_only}@postgres:5432/${POSTGRES_DB:-kombe}
    command: ["node", "packages/db/scripts/migrate.mjs", "migrate"]
    profiles: ["tools"]

  # One-shot des preuves base réelle (C01 : RLS kombe_app, verrous, pool A/B, FK ;
  # C13 : recettes outbox/lease/rollback via worker/test/postgres.mjs).
  # isolation.pg.mjs RECONSTRUIT le schéma (down→up) et pose `SET ROLE kombe_app` :
  # il faut donc une base DÉJÀ migrée au départ, sinon le premier .down.sql échoue
  # sur des objets absents. On migre kombe_test puis on lance isolation.
  #
  # CONNEXION = kombe_migrateur (PROPRIÉTAIRE de kombe_test, cf. docker-init.sql),
  # PAS le superuser `kombe` : c'est ce qui fait que les DEFAULT PRIVILEGES posés à
  # l'init s'appliquent aux tables créées ici, donnant le DML à kombe_app sans
  # BYPASSRLS → la RLS est réellement éprouvée (sinon dbtest serait FAIL, pas PASS).
  dbtest:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KOMBE_DATABASE_URL: postgresql://kombe_migrateur:${KOMBE_MIGRATEUR_PASSWORD:-kombe}@postgres:5432/kombe_test
      KOMBE_TEST_DATABASE_URL: postgresql://kombe_migrateur:${KOMBE_MIGRATEUR_PASSWORD:-kombe}@postgres:5432/kombe_test
    command: ["/bin/sh", "-c", "node packages/db/scripts/migrate.mjs migrate && node packages/db/tests/isolation.pg.mjs"]
    profiles: ["test"]

volumes:
  pgdata:
